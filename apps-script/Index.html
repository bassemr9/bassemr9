<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --noir: #121212; --texte: #1c1c1e; --texte-2: #6b6f76; --texte-3: #a1a5ab;
      --fond: #e9ecef; --app: #f4f5f7; --carte: #ffffff; --bord: #e4e6ea;
      --vert: #1fa463; --vert-clair: #e3f6ec; --rouge: #ef4444;
      --orange: #f7931e; --bleu: #2d9cdb; --violet: #8b2fc9; --rose: #f2547d; --jaune: #f5b301;
      --ombre: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: var(--texte); background: var(--fond); }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    [hidden] { display: none !important; }
    img.tw { width: 1.1em; height: 1.1em; vertical-align: -0.18em; }

    .app { display: flex; min-height: 100vh; background: var(--app); }

    /* ---------- Barre d'icônes à gauche ---------- */
    .rail { width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 0;
            position: sticky; top: 0; height: 100vh; }
    .rail .logo { font-weight: 700; font-size: 20px; margin-bottom: 18px; }
    .rail-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--texte-2);
                border: 1px solid var(--bord); background: var(--carte); transition: all .15s; position: relative; }
    .rail-btn:hover { color: var(--noir); border-color: #c9ccd1; }
    .rail-btn.actif { background: var(--noir); color: #fff; border-color: var(--noir); }
    .rail-btn[data-titre]:hover::after { content: attr(data-titre); position: absolute; left: 48px; white-space: nowrap; background: var(--noir);
                                          color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 8px; z-index: 30; }

    .contenu { flex: 1; min-width: 0; padding: 16px 22px 30px 6px; }

    /* ---------- En-tête (une seule ligne) ---------- */
    .entete { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .marque { font-weight: 700; font-size: 22px; letter-spacing: -.03em; line-height: 1.1; margin-right: 6px; }
    .marque small { display: block; font-size: 10px; font-weight: 500; color: var(--texte-3); letter-spacing: .01em; }
    .espace { flex: 1; }
    .pilules { display: inline-flex; gap: 5px; flex-wrap: wrap; }
    .pilule { padding: 6px 13px; border-radius: 999px; border: 1px solid #cfd2d6; font-size: 12px; font-weight: 500;
              background: transparent; transition: all .15s; white-space: nowrap; }
    .pilule:hover { border-color: var(--noir); }
    .pilule.actif { background: var(--noir); color: #fff; border-color: var(--noir); }
    .pilule small { opacity: .55; margin-left: 4px; }
    .entete .btn { padding: 8px 15px; font-size: 12px; }
    .recherche { position: relative; flex: 1 1 260px; }
    .recherche svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--texte-3); }
    .recherche input { width: 100%; padding: 8px 12px 8px 36px; border-radius: 999px; border: 1px solid var(--bord);
                       background: var(--carte); outline: none; font-size: 13px; }
    .recherche input:focus { border-color: var(--noir); }

    /* ---------- Panneaux ---------- */
    .panneau { background: var(--carte); border-radius: 18px; padding: 14px; box-shadow: var(--ombre); }
    .panneau-tete { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
    .panneau-tete h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .rond { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--bord); display: grid; place-items: center;
            color: var(--texte); transition: all .15s; flex-shrink: 0; }
    .rond:hover { background: var(--noir); color: #fff; border-color: var(--noir); }

    /* Bandes horizontales compactes */
    .bande { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 999px; margin-bottom: 8px; }
    .bande > .pilules { flex-wrap: nowrap; flex-shrink: 0; }
    .separateur { width: 1px; align-self: stretch; background: var(--bord); flex-shrink: 0; }
    .compte-mini b { width: 24px; height: 24px; border-radius: 50%; background: var(--noir); color: #fff; font-size: 11px;
                     display: grid; place-items: center; }
    .lien { font-size: 12px; color: var(--texte-2); font-weight: 500; padding: 4px 8px; flex-shrink: 0; }
    .lien:hover { color: var(--noir); }

    /* ---------- Bande catégories + ingrédients ---------- */
    .stats { border-radius: 18px; padding: 8px 12px; margin-bottom: 10px; }
    .donut { width: 44px; height: 44px; flex-shrink: 0; }
    .natures { flex-direction: column; flex-wrap: nowrap; gap: 4px; }
    .natures .pilule { padding: 4px 11px; font-size: 11px; text-align: left; }
    .natures .pilule i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .stats { align-items: flex-start; }
    .puces { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0; }
    .puce { display: inline-flex; align-items: center; gap: 6px; padding: 4px 5px 4px 4px; border-radius: 999px; font-size: 12px;
            font-weight: 500; background: #f3f4f6; color: #5f636a; border: 1px solid transparent; transition: all .15s; white-space: nowrap; }
    .puce .ico { width: 22px; height: 22px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 13px; }
    .puce .nb { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #fff; color: var(--texte-2);
                font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
    .puce:hover { border-color: #cfd2d6; color: var(--texte); }
    .puce.actif { background: var(--vert); color: #fff; }
    .puce.actif .nb { color: var(--vert); }
    .puce.impossible { opacity: .35; }
    .ingr-zone { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
    .ingr-tete { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .replier { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; border: 1px solid #cfd2d6; }
    .replier:hover { border-color: var(--noir); }
    .choisis-ligne { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--texte-3); }
    /* Cadres de familles, rangés côte à côte comme un mur de briques */
    .blocs { columns: 250px; column-gap: 8px; }
    .bloc-fam { break-inside: avoid; margin-bottom: 8px; border-radius: 14px; padding: 8px 9px 9px; border: 1px solid transparent; }
    .bloc-fam h4 { margin: 0 0 7px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
    .bloc-fam h4 small { color: var(--texte-3); font-weight: 500; }
    .bloc-fam h4 .sel { margin-left: auto; background: var(--vert); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 10px; line-height: 17px; }
    .bloc-fam .puces { gap: 5px; }
    .bloc-fam .puce { background: rgba(255,255,255,.85); }
    .bloc-fam .puce.actif { background: var(--vert); }
    .bloc-fam.a-classer { border: 1px dashed #f0c78a; }
    /* Crayon pour changer la famille d'un ingrédient (visible au survol, toujours sur écran tactile et dans « À classer ») */
    .crayon { width: 18px; height: 18px; border-radius: 50%; display: none; place-items: center; font-size: 10px; background: #fff;
              color: var(--texte-2); margin-left: -2px; }
    .crayon:hover { background: var(--noir); color: #fff; }
    .bloc-fam .puce:hover .crayon, .bloc-fam.a-classer .crayon { display: grid; }
    @media (hover: none) { .bloc-fam .crayon { display: grid; } }

    /* Alertes de doublon et nouveaux ingrédients dans le formulaire */
    .alerte { margin-top: 6px; padding: 9px 11px; border-radius: 12px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .alerte.forte { background: #fdecec; color: #9f1c1c; }
    .alerte.douce { background: #fff6e0; color: #8a5a00; }
    .alerte b { font-weight: 700; }
    .alerte .btn { padding: 5px 11px; font-size: 11.5px; }
    .nouveaux { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: #f1f8f4; border: 1px dashed #b7dfc6; }
    .nouveaux h5 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--vert); }
    .ligne-ingr { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    .ligne-ingr span { flex: 1; min-width: 0; }
    .form .ligne-ingr input { flex: 0 0 52%; padding: 7px 10px; font-size: 12.5px; background: #fff; }
    .liste-familles { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }

    .resultats { min-height: calc(100vh - 150px); }

    /* ---------- Cartes de repas ---------- */
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 10px; }
    .carte { border-radius: 16px; padding: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s;
             display: flex; flex-direction: column; gap: 6px; animation: apparait .3s ease both; }
    .carte:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.07); }
    @keyframes apparait { from { opacity: 0; transform: translateY(6px); } }
    .carte-tete { display: flex; align-items: center; justify-content: space-between; }
    .carte-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; background: #fff; }
    .coche { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #b9bdc3; display: grid; place-items: center;
             font-size: 11px; color: transparent; }
    .carte:hover .coche { border-color: var(--noir); color: var(--noir); }
    .carte h4 { margin: 2px 0 0; font-size: 13px; font-weight: 600; line-height: 1.3; }
    .carte .desc { font-size: 11.5px; color: var(--texte-2); line-height: 1.45; }
    .carte .desc b { color: var(--vert); font-weight: 600; }
    .carte .meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--texte-3); margin-top: auto; padding-top: 4px; }
    mark { background: #fff1a8; color: inherit; border-radius: 3px; }
    .vide { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--texte-2); }
    .vide div { font-size: 40px; margin-bottom: 6px; }
    .vide b { display: block; color: var(--texte); margin-bottom: 4px; }

    /* ---------- Boutons ---------- */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 13px;
           transition: all .15s; white-space: nowrap; }
    .btn-noir { background: var(--noir); color: #fff; }
    .btn-noir:hover { background: #333; }
    .btn-contour { border: 1px solid #cfd2d6; }
    .btn-contour:hover { border-color: var(--noir); }
    .btn-danger { color: var(--rouge); border: 1px solid #f5c2c2; }
    .btn-danger:hover { background: var(--rouge); color: #fff; }
    .btn[disabled] { opacity: .5; pointer-events: none; }

    /* ---------- Fenêtres ---------- */
    .fond { position: fixed; inset: 0; background: rgba(18,18,18,.35); backdrop-filter: blur(4px); display: none;
            align-items: center; justify-content: center; padding: 16px; z-index: 40; }
    .fond.ouvert { display: flex; animation: fondu .2s ease; }
    @keyframes fondu { from { opacity: 0; } }
    .fenetre { background: var(--carte); border-radius: 24px; width: 100%; max-width: 540px; max-height: 92vh; overflow: auto; padding: 22px;
               box-shadow: 0 30px 60px rgba(0,0,0,.2); animation: monte .22s ease; }
    @keyframes monte { from { opacity: 0; transform: translateY(14px); } }
    .fenetre-tete { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .fenetre-tete .carte-ico { width: 48px; height: 48px; border-radius: 14px; font-size: 26px; }
    .fenetre-tete h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
    .fenetre-tete p { margin: 3px 0 0; font-size: 12px; color: var(--texte-2); }
    .fenetre-tete .rond { margin-left: auto; }
    .bloc { margin-bottom: 14px; }
    .bloc h5 { margin: 0 0 7px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--texte-3); font-weight: 600; }
    .bloc .texte { background: var(--app); border-radius: 12px; padding: 11px 12px; font-size: 13px; }
    .etiquettes { display: flex; flex-wrap: wrap; gap: 6px; }
    .etiquettes span { font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 999px; background: var(--app); }
    .etiquettes span.choisi { background: var(--vert-clair); color: var(--vert); }
    .etiquettes.fac span { background: #fff; border: 1px dashed #cfd2d6; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
    .actions .gauche { margin-right: auto; }

    .form label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 5px; color: var(--texte-2); }
    .form input, .form textarea { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--bord); background: var(--app);
                                  outline: none; resize: vertical; font-size: 14px; }
    .form input:focus, .form textarea:focus { border-color: var(--noir); background: #fff; }
    .form .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .aide { font-size: 11px; color: var(--texte-3); margin-top: 4px; }

    #message { position: fixed; bottom: 20px; right: 20px; background: var(--noir); color: #fff; padding: 12px 18px; border-radius: 999px;
               font-size: 13px; font-weight: 500; z-index: 50; transform: translateY(100px); opacity: 0; transition: all .3s ease; }
    #message.visible { transform: none; opacity: 1; }

    @media (max-width: 640px) {
      .rail { display: none; }
      .contenu { padding: 12px; }
      .recherche { order: 5; flex-basis: 100%; }
      .entete .btn { margin-left: auto; }
      .bande { flex-wrap: wrap; border-radius: 18px; }
      .bande > .pilules { flex-wrap: wrap; }
      .bande .separateur, .bande .compte-mini { display: none; }
      .bande .ingr-zone { flex: 1 1 100%; }
      .blocs { columns: 1; }
      .stats .donut { display: none; }
      .natures { flex-direction: row; }
      .resultats { min-height: 0; }
      .grille { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .form .deux { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">

    <aside class="rail">
      <div class="logo">ir.</div>
      <button class="rail-btn actif" data-titre="Tous les repas" onclick="toutEffacer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      </button>
      <button class="rail-btn" data-titre="Nouveau repas" onclick="ouvrirFormulaire()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="rail-btn" data-titre="Idée au hasard" onclick="aleatoire()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button class="rail-btn" data-titre="Rechercher les doublons" onclick="afficherDoublons()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="rail-btn" data-titre="Réinitialiser les filtres" onclick="toutEffacer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </aside>

    <main class="contenu">
      <header class="entete">
        <div class="marque">Mes Repas<small>idée repas · carnet de recettes</small></div>
        <div class="recherche">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="recherche" placeholder="Rechercher un plat ou un ingrédient…" oninput="afficher()" autocomplete="off">
        </div>
        <div class="pilules" id="mode">
          <button class="pilule actif" data-mode="tout" onclick="choisirMode('tout')">Tout</button>
          <button class="pilule" data-mode="nom" onclick="choisirMode('nom')">Par nom</button>
          <button class="pilule" data-mode="ingr" onclick="choisirMode('ingr')">Par ingrédient</button>
        </div>
        <button class="btn btn-noir" onclick="ouvrirFormulaire()">＋ Nouveau</button>
      </header>

      <!-- Bande unique : catégories + tous les ingrédients (liste dynamique, retour à la ligne) -->
      <section class="panneau bande stats">
        <svg class="donut" id="donut" viewBox="0 0 42 42"></svg>
        <div class="pilules natures" id="natures"></div>
        <span class="separateur"></span>
        <span class="compte-mini" title="Nombre d'ingrédients"><b id="nbIngr">0</b></span>
        <div class="ingr-zone">
          <div class="ingr-tete">
            <button class="replier" id="btnReplier" onclick="basculerReplie()"></button>
            <div class="choisis-ligne" id="choisisLigne"></div>
          </div>
          <div class="blocs" id="blocs"></div>
        </div>
        <button class="lien" id="effacerIngr" onclick="effacerIngredients()" hidden>Effacer</button>
      </section>

      <section class="panneau resultats">
        <div class="panneau-tete">
          <h3 id="titreRes">Tous les repas</h3>
          <span style="font-size:12px;color:var(--texte-2)" id="info">Chargement…</span>
        </div>
        <div class="grille" id="liste"></div>
      </section>
    </main>
  </div>

  <!-- Détail -->
  <div class="fond" id="fondDetail" onclick="if(event.target===this)fermer('fondDetail')">
    <div class="fenetre" id="detail"></div>
  </div>

  <!-- Formulaire -->
  <div class="fond" id="fondForm" onclick="if(event.target===this)fermer('fondForm')">
    <div class="fenetre form">
      <div class="fenetre-tete">
        <div>
          <h2 id="titreForm">Nouveau repas</h2>
          <p>Enregistré directement dans votre Google Sheet</p>
        </div>
        <button class="rond" onclick="fermer('fondForm')">✕</button>
      </div>
      <input type="hidden" id="f_code">
      <div class="deux">
        <div>
          <label>Nom du repas *</label>
          <input id="f_libelle" placeholder="Ex : COUSCOUS AU POULET" oninput="verifierDoublon()" autocomplete="off">
        </div>
        <div>
          <label>Catégorie</label>
          <input id="f_nature" list="listeNatures" placeholder="REPAS, FAST FOOD…">
          <datalist id="listeNatures"></datalist>
        </div>
      </div>
      <div id="alerteDoublon"></div>
      <label>Ingrédients principaux</label>
      <textarea id="f_principal" rows="2" placeholder="TOMATE / OIGNON / POULET" oninput="majNouveauxIngr()"></textarea>
      <div class="aide">Séparez les ingrédients par « / » ou « - »</div>
      <label>Ingrédients facultatifs</label>
      <textarea id="f_facultatif" rows="2" oninput="majNouveauxIngr()"></textarea>
      <div id="nouveauxIngr"></div>
      <datalist id="listeFamilles"></datalist>
      <label>Astuce</label>
      <textarea id="f_astuce" rows="2"></textarea>
      <label>Remarque</label>
      <textarea id="f_remarque" rows="2"></textarea>
      <div class="actions">
        <button class="btn btn-contour" onclick="fermer('fondForm')">Annuler</button>
        <button class="btn btn-noir" id="btnEnregistrer" onclick="enregistrer()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Changer la famille d'un ingrédient -->
  <div class="fond" id="fondFamille" onclick="if(event.target===this)fermer('fondFamille')">
    <div class="fenetre form" style="max-width:420px">
      <div class="fenetre-tete">
        <div>
          <h2 id="titreFamille">Famille</h2>
          <p>Enregistré dans l'onglet « Ingrédients » du Google Sheet</p>
        </div>
        <button class="rond" onclick="fermer('fondFamille')">✕</button>
      </div>
      <div class="liste-familles" id="choixFamilles"></div>
      <label>Ou une nouvelle famille</label>
      <input id="nouvelleFamille" placeholder="Ex : CHARCUTERIE" onkeydown="if(event.key==='Enter')validerFamille(this.value)">
      <div class="actions">
        <button class="btn btn-contour" onclick="fermer('fondFamille')">Annuler</button>
        <button class="btn btn-noir" onclick="validerFamille(document.getElementById('nouvelleFamille').value)">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Confirmation -->
  <div class="fond" id="fondConfirm" onclick="if(event.target===this)fermer('fondConfirm')">
    <div class="fenetre" style="max-width:380px;text-align:center">
      <div style="font-size:40px">🗑️</div>
      <h2 style="margin:6px 0;font-size:19px;font-weight:600">Supprimer ce repas ?</h2>
      <div style="font-size:13px;color:var(--texte-2)" id="texteConfirm"></div>
      <div class="actions" style="justify-content:center">
        <button class="btn btn-contour" onclick="fermer('fondConfirm')">Annuler</button>
        <button class="btn btn-noir" style="background:var(--rouge)" id="btnConfirm">Supprimer</button>
      </div>
    </div>
  </div>

  <div id="message"></div>

  <script>
    let repas = [];
    let mode = 'tout';
    let natureChoisie = '';

    // Hors de Google Sheets (aperçu du fichier), on utilise des données de démonstration
    const DEMO = typeof google === 'undefined' || !google.script;
    let demo = [
      { code: 'R001', nature: 'REPAS', libelle: 'MOSLI AZ3AR AU POULET', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL - POULET / DJEJ', facultatif: '', astuce: 'FAIRE ROUGIR AU FOUR', remarque: '' },
      { code: 'R002', nature: 'REPAS', libelle: 'TCHICH AU POISSON', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL / POISSON', facultatif: '', astuce: '', remarque: '' },
      { code: 'R003', nature: 'REPAS', libelle: 'TCHALWICHA', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL', facultatif: '', astuce: '', remarque: '' },
      { code: 'R004', nature: 'FAST FOOD', libelle: 'HAMBURGER', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL / BURGER', facultatif: '', astuce: '', remarque: '' },
      { code: 'R005', nature: 'FAST FOOD', libelle: 'PIZZA', principal: 'TOMATE / THON / OEUF', facultatif: 'FROMAGE', astuce: '', remarque: '' },
      { code: 'R006', nature: 'REPAS', libelle: 'M7AMMAR - MHAMMAR', principal: 'HROUS / STEAK SANS OS / TOMATE CONCENTRE', facultatif: '', astuce: '', remarque: '' }
    ];
    // Contenu de démonstration de l'onglet "Ingrédients"
    const demoIngredients = [
      ['TOMATE', 'LÉGUMES', ''], ['OIGNON', 'LÉGUMES', 'BSAL'], ['POIVRON', 'LÉGUMES', 'FILFIL'],
      ['POULET', 'PROTÉINES', 'DJEJ'], ['POISSON', 'PROTÉINES', ''], ['THON', 'PROTÉINES', ''], ['OEUF', 'PROTÉINES', ''],
      ['BURGER', 'PROTÉINES', ''], ['STEAK SANS OS', 'PROTÉINES', ''], ['FROMAGE', 'PRODUITS LAITIERS', ''],
      ['HROUS', 'ÉPICES & SAUCES', ''], ['TOMATE CONCENTRE', 'ÉPICES & SAUCES', '']
    ].map(([nom, famille, syn]) => ({ nom, famille, synonymes: syn ? [syn] : [], icone: '' }));
    const demoServeur = {
      getDonnees: () => ({ repas: demo, ingredients: demoIngredients }),
      enregistrerRepas: r => {
        if (!r.forcer) {
          const d = ressemblants(r.libelle, r.code).identique;
          if (d) throw new Error('DOUBLON|' + d.code + '|' + d.libelle);
        }
        demoServeur.changerFamilles(r.familles || {});
        const i = demo.findIndex(x => x.code === r.code);
        const max = demo.reduce((m, x) => Math.max(m, parseInt(x.code.replace(/\D/g, ''), 10) || 0), 0);
        const n = {};
        ['code', 'libelle', 'nature', 'principal', 'facultatif', 'astuce', 'remarque'].forEach(k => n[k] = String(r[k] || '').trim().toUpperCase());
        n.code = i >= 0 ? demo[i].code : 'R' + String(max + 1).padStart(3, '0');
        if (i >= 0) demo[i] = n; else demo.push(n);
        return demoServeur.getDonnees();
      },
      supprimerRepas: code => { demo = demo.filter(x => x.code !== code); return demoServeur.getDonnees(); },
      changerFamilles: familles => Object.keys(familles).forEach(nom => {
        const i = demoIngredients.find(x => x.nom === nom || x.synonymes.includes(nom));
        if (i) i.famille = familles[nom].toUpperCase();
        else demoIngredients.push({ nom, famille: familles[nom].toUpperCase(), synonymes: [], icone: '' });
      }),
      changerFamille: ([nom, famille]) => { demoServeur.changerFamilles({ [nom]: famille }); return demoServeur.getDonnees(); }
    };

    // Appelle une fonction de Code.gs (ou sa version démo)
    function serveur(fn, arg, ok, ko) {
      if (DEMO) {
        try { ok(JSON.parse(JSON.stringify(demoServeur[fn](arg)))); } catch (e) { ko(e); }
        return;
      }
      const runner = google.script.run.withSuccessHandler(ok).withFailureHandler(ko);
      Array.isArray(arg) ? runner[fn](...arg) : runner[fn](arg);
    }

    function charger() {
      document.getElementById('liste').innerHTML = '<div class="vide"><div>⏳</div><b>Chargement des repas…</b></div>';
      serveur('getDonnees', undefined, maj, erreur);
      if (DEMO) toast('Mode démo : vos vraies données s’affichent dans Google Sheets');
    }

    function maj(donnees) {
      // Accepte aussi l'ancien format (simple liste de repas)
      const d = Array.isArray(donnees) ? { repas: donnees, ingredients: [] } : (donnees || {});
      repas = d.repas || [];
      chargerIngredients(d.ingredients || []);
      const natures = [...new Set(repas.map(r => r.nature).filter(Boolean))].sort();
      if (natureChoisie && !natures.includes(natureChoisie)) natureChoisie = '';
      document.getElementById('listeNatures').innerHTML = natures.map(n => `<option value="${esc(n)}">`).join('');
      afficher();
    }

    // ---------- Outils ----------

    // Supprime accents et met en minuscules pour une recherche tolérante
    function norm(s) {
      return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function decouper(s) {
      return String(s || '').split(/\s*[\/\-,;]\s*/).map(x => x.trim()).filter(Boolean);
    }

    function surligner(texte, termes) {
      let h = esc(texte);
      termes.forEach(t => {
        if (!t) return;
        const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        h = h.replace(re, '<mark>$1</mark>');
      });
      return h;
    }

    // ---------- Couleurs et emojis ----------

    // Couleur vive (graphiques) + fond pastel (cartes) par catégorie
    const COULEURS = [
      ['#f7931e', '#fff1e3'], ['#2d9cdb', '#e6f3fb'], ['#f2547d', '#fde8ee'],
      ['#1fa463', '#e3f6ec'], ['#8b2fc9', '#f1e6fa'], ['#f5b301', '#fef6dc']
    ];
    let couleurNature = {};

    function couleurs(nature) { return couleurNature[nature] || COULEURS[COULEURS.length - 1]; }

    // Emoji du plat d'après son nom, sinon d'après sa catégorie
    const PLATS = [
      [/pizza/, '🍕'], [/burger/, '🍔'], [/sandwich|chapati|makloub|libanais/, '🥪'], [/tacos|wrap/, '🌯'],
      [/salade/, '🥗'], [/soupe|chorba|lablabi/, '🍲'], [/couscous|riz/, '🍛'], [/pate|spaghetti|macaroni|lasagne/, '🍝'],
      [/poisson|thon|sardine/, '🐟'], [/poulet|djej/, '🍗'], [/frite/, '🍟'], [/oeuf|ojja|omelette/, '🍳'],
      [/brik/, '🥟'], [/gateau|dessert|tarte/, '🍰'], [/viande|mhammar|m7ammar|kefta|steak/, '🥩']
    ];

    function emojiRepas(r) {
      const n = norm(r.libelle);
      const p = PLATS.find(([re]) => re.test(n));
      if (p) return p[1];
      return /fast/.test(norm(r.nature)) ? '🍟' : '🥘';
    }

    // ---------- Ingrédients : synonymes et icônes ----------

    // Remplis depuis l'onglet "Ingrédients" du Google Sheet
    let SYNONYMES = {};   // nom ou synonyme -> nom de référence
    let FAMILLE = {};     // nom de référence -> famille
    let ICONE_FEUILLE = {}; // nom de référence -> icône choisie dans la feuille

    const A_CLASSER = 'À CLASSER';
    // Ordre et emoji des familles connues ; une famille inventée dans la feuille s'ajoute après
    const FAMILLES = [
      ['PROTÉINES', '🥩'], ['LÉGUMES', '🥬'], ['FÉCULENTS', '🍞'], ['PRODUITS LAITIERS', '🧀'],
      ['ÉPICES & SAUCES', '🌶️'], ['FRUITS', '🍋']
    ];
    // Couleur pastel du cadre de chaque famille
    const FOND_FAMILLE = {
      'PROTÉINES': '#fdeeee', 'LÉGUMES': '#e9f6ee', 'FÉCULENTS': '#fbf3e2', 'PRODUITS LAITIERS': '#fff8d9',
      'ÉPICES & SAUCES': '#fdeee5', 'FRUITS': '#fff4dc', 'À CLASSER': '#fffaf2'
    };
    const FOND_AUTRE = '#eef3f9';

    // Bloc des ingrédients replié ou non (mémorisé dans ce navigateur)
    let replie = false;
    try { replie = localStorage.getItem('ingredientsReplies') === '1'; } catch (e) {}

    function chargerIngredients(liste) {
      SYNONYMES = {}; FAMILLE = {}; ICONE_FEUILLE = {};
      liste.forEach(i => {
        const nom = String(i.nom || '').toUpperCase();
        if (!nom) return;
        SYNONYMES[nom] = nom;
        (i.synonymes || []).forEach(s => SYNONYMES[String(s).toUpperCase()] = nom);
        if (i.famille) FAMILLE[nom] = String(i.famille).toUpperCase();
        if (i.icone) ICONE_FEUILLE[nom] = i.icone;
      });
    }

    function familleDe(c) { return FAMILLE[c] || A_CLASSER; }

    function emojiFamille(f) {
      const connue = FAMILLES.find(([nom]) => norm(nom) === norm(f));
      return connue ? connue[1] : f === A_CLASSER ? '📦' : '🏷️';
    }

    // Le premier motif qui correspond donne l'icône (l'ordre compte)
    const ICONES = [
      [/tomate concentr/, '🥫'], [/tomate/, '🍅'], [/oignon/, '🧅'], [/\bail\b/, '🧄'],
      [/poivron/, '🫑'], [/piment|harissa|hrous/, '🌶️'], [/poulet|dinde/, '🍗'],
      [/poisson|thon|sardine|merou|dorade/, '🐟'], [/crevette|fruits de mer|calamar/, '🦐'],
      [/burger/, '🍔'], [/steak|viande|boeuf|agneau|mouton|kefta|merguez/, '🥩'],
      [/oeuf/, '🥚'], [/fromage|mozzarella|gruyere/, '🧀'], [/pomme de terre|patate|frite/, '🥔'],
      [/carotte/, '🥕'], [/pain|baguette|mlewi|tabouna/, '🥖'], [/riz/, '🍚'],
      [/pate|spaghetti|macaroni|couscous|nouille/, '🍝'], [/citron/, '🍋'], [/olive|huile/, '🫒'],
      [/lait|creme/, '🥛'], [/persil|coriandre|menthe|basilic/, '🌿'], [/salade|laitue|epinard/, '🥬'],
      [/champignon/, '🍄'], [/mais/, '🌽'], [/aubergine/, '🍆'], [/courgette|concombre/, '🥒'],
      [/pois chiche|lentille|haricot|feve/, '🫘'], [/sel\b|epice|cumin|poivre\b/, '🧂']
    ];

    function canon(i) { const u = i.toUpperCase(); return SYNONYMES[u] || u; }

    function icone(nom) {
      if (ICONE_FEUILLE[nom]) return ICONE_FEUILLE[nom];
      const n = norm(nom);
      const trouve = ICONES.find(([re]) => re.test(n));
      return trouve ? trouve[1] : '🥄';
    }

    // Ensemble des ingrédients (noms de référence) d'un repas
    function ingredientsDe(r) {
      return new Set(decouper(r.principal + ' / ' + r.facultatif).map(canon));
    }

    // Ingrédients sans doublons de synonymes (OIGNON / BSAL -> OIGNON)
    function uniques(s) { return [...new Set(decouper(s).map(canon))]; }

    // Libellé d'une puce : nom de référence + synonymes trouvés dans la feuille
    let libellesIngr = {};
    let compteIngr = {};
    let choisis = new Set();

    function construirePuces() {
      compteIngr = {};
      libellesIngr = {};
      repas.forEach(r => decouper(r.principal + ' / ' + r.facultatif).forEach(brut => {
        const c = canon(brut);
        (libellesIngr[c] = libellesIngr[c] || new Set([c])).add(brut.toUpperCase());
      }));
      repas.forEach(r => ingredientsDe(r).forEach(c => compteIngr[c] = (compteIngr[c] || 0) + 1));
      // On retire des choix les ingrédients qui n'existent plus
      choisis = new Set([...choisis].filter(c => compteIngr[c]));
      return Object.keys(compteIngr).sort((a, b) => compteIngr[b] - compteIngr[a] || a.localeCompare(b));
    }

    function basculer(c) {
      choisis.has(c) ? choisis.delete(c) : choisis.add(c);
      afficher();
    }

    function choisirNature(n) { natureChoisie = natureChoisie === n && n ? '' : n; afficher(); }

    function choisirMode(m) {
      mode = m;
      document.querySelectorAll('#mode .pilule').forEach(b => b.classList.toggle('actif', b.dataset.mode === m));
      afficher();
    }

    function effacerIngredients() { choisis.clear(); afficher(); }

    function basculerReplie() {
      replie = !replie;
      try { localStorage.setItem('ingredientsReplies', replie ? '1' : '0'); } catch (e) {}
      afficher();
    }

    function toutEffacer() {
      choisis.clear();
      natureChoisie = '';
      document.getElementById('recherche').value = '';
      afficher();
    }

    // ---------- Filtrage ----------

    function filtrer() {
      const termes = norm(document.getElementById('recherche').value).split(/\s+/).filter(Boolean);
      return {
        termes,
        liste: repas.filter(r => {
          if (natureChoisie && r.nature !== natureChoisie) return false;
          const sesIngr = ingredientsDe(r);
          if (![...choisis].every(c => sesIngr.has(c))) return false;
          const nom = norm(r.libelle + ' ' + r.code);
          const ingr = norm(r.principal + ' ' + r.facultatif);
          const cible = mode === 'nom' ? nom : mode === 'ingr' ? ingr : nom + ' ' + ingr + ' ' + norm(r.astuce + ' ' + r.remarque);
          return termes.every(t => cible.includes(t));
        })
      };
    }

    // ---------- Affichage ----------

    function afficherNatures(natures, compte) {
      const bouton = (val, txt, nb) =>
        `<button class="pilule ${natureChoisie === val ? 'actif' : ''}" onclick="choisirNature('${esc(val)}')">${txt}<small>${nb}</small></button>`;
      document.getElementById('natures').innerHTML = bouton('', 'Toutes', repas.length) +
        natures.map(n => bouton(n, `<i style="background:${couleurs(n)[0]}"></i>${esc(n)}`, compte[n])).join('');
    }

    function afficherDonut(natures, compte) {
      const total = natures.reduce((s, n) => s + compte[n], 0) || 1;
      const C = 2 * Math.PI * 15.9155; // circonférence = 100
      let decalage = 25, svg = '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#eef0f2" stroke-width="6"/>';
      natures.forEach(n => {
        const part = compte[n] / total * 100;
        const trait = Math.max(part - (natures.length > 1 ? 2 : 0), 0.5);
        const opacite = natureChoisie && natureChoisie !== n ? .25 : 1;
        svg += `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${couleurs(n)[0]}" stroke-width="6" stroke-linecap="round"
                  stroke-dasharray="${trait} ${C - trait}" stroke-dashoffset="${decalage}" opacity="${opacite}"
                  style="cursor:pointer" onclick="choisirNature('${esc(n)}')"/>`;
        decalage -= part;
      });
      svg += `<text x="21" y="24.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1c1c1e">${repas.length}</text>`;
      document.getElementById('donut').innerHTML = svg;
    }

    // Tous les ingrédients de la feuille (la liste suit automatiquement les ajouts),
    // avec un badge du nombre de repas qui les utilisent
    function afficherIngredients(resultats, tous) {
      // Ingrédients présents dans au moins un des résultats actuels
      const possibles = new Set();
      resultats.forEach(r => ingredientsDe(r).forEach(c => possibles.add(c)));
      // Familles présentes, dans l'ordre : connues, puis inventées dans la feuille, puis « À classer »
      const parFamille = {};
      tous.forEach(c => (parFamille[familleDe(c)] = parFamille[familleDe(c)] || []).push(c));
      const ordre = FAMILLES.map(([f]) => f).filter(f => parFamille[f]);
      Object.keys(parFamille).filter(f => !ordre.includes(f) && f !== A_CLASSER).sort().forEach(f => ordre.push(f));
      if (parFamille[A_CLASSER]) ordre.push(A_CLASSER);

      const puce = c => {
        const classe = choisis.has(c) ? 'actif' : possibles.has(c) ? '' : 'impossible';
        const libelle = [...libellesIngr[c]].join(' / ');
        return `<button class="puce ${classe}" onclick="basculer('${esc(c)}')" title="${esc(libelle)} : ${compteIngr[c]} repas">
                  <span class="ico">${icone(c)}</span>${esc(libelle)}<span class="nb">${compteIngr[c]}</span>
                  <span class="crayon" title="Changer de famille" onclick="event.stopPropagation();ouvrirFamille('${esc(c)}')">✏️</span></button>`;
      };
      const nomFamille = f => f.charAt(0) + f.slice(1).toLowerCase();

      // Bouton replier / afficher, et rappel des ingrédients choisis quand c'est replié
      document.getElementById('btnReplier').textContent = replie ? 'Afficher les ingrédients ▾' : 'Masquer les ingrédients ▴';
      const ligne = document.getElementById('choisisLigne');
      ligne.hidden = !replie;
      ligne.innerHTML = choisis.size ? tous.filter(c => choisis.has(c)).map(puce).join('') : 'Aucun ingrédient choisi';

      // Un cadre par famille, tous ouverts
      const blocs = document.getElementById('blocs');
      blocs.hidden = replie;
      blocs.innerHTML = ordre.map(f => {
        const liste = parFamille[f];
        const nbSel = liste.filter(c => choisis.has(c)).length;
        return `<div class="bloc-fam ${f === A_CLASSER ? 'a-classer' : ''}" style="background:${FOND_FAMILLE[f] || FOND_AUTRE}">
                  <h4>${emojiFamille(f)} ${esc(nomFamille(f))} <small>${liste.length}</small>${nbSel ? `<span class="sel">${nbSel} ✓</span>` : ''}</h4>
                  <div class="puces">${liste.map(puce).join('')}</div>
                </div>`;
      }).join('') || '<span class="aide">Aucun ingrédient pour l’instant.</span>';
      document.getElementById('nbIngr').textContent = tous.length;
      document.getElementById('effacerIngr').hidden = !choisis.size;
    }

    function texteIngr(s, termes) {
      return uniques(s).map(c => choisis.has(c) ? `<b>${esc(c.toLowerCase())}</b>` : surligner(c.toLowerCase(), termes)).join(', ');
    }

    function afficher() {
      const tous = construirePuces();
      const compte = {};
      repas.forEach(r => { if (r.nature) compte[r.nature] = (compte[r.nature] || 0) + 1; });
      const natures = Object.keys(compte).sort();
      couleurNature = {};
      natures.forEach((n, i) => couleurNature[n] = COULEURS[i % COULEURS.length]);

      const { termes, liste } = filtrer();
      afficherNatures(natures, compte);
      afficherDonut(natures, compte);
      afficherIngredients(liste, tous);

      const filtre = termes.length || choisis.size || natureChoisie;
      document.getElementById('titreRes').textContent = filtre ? 'Résultats' : 'Tous les repas';
      document.getElementById('info').textContent = `${liste.length} sur ${repas.length}`;

      document.getElementById('liste').innerHTML = liste.map((r, n) => {
        const [vif, pastel] = couleurs(r.nature);
        return `
        <article class="carte" style="background:${pastel};animation-delay:${Math.min(n, 12) * 25}ms" onclick="voir('${esc(r.code)}')">
          <div class="carte-tete">
            <span class="carte-ico" style="box-shadow:inset 0 0 0 1.5px ${vif}33">${emojiRepas(r)}</span>
            <span class="coche">✓</span>
          </div>
          <h4>${surligner(r.libelle, termes)}</h4>
          <div class="desc">${texteIngr(r.principal, termes)}${r.facultatif ? ` <span style="opacity:.7">(+ ${texteIngr(r.facultatif, termes)})</span>` : ''}</div>
          <div class="meta"><span style="color:${vif};font-weight:600">${esc(r.nature || '—')}</span><span>${r.astuce ? '💡 ' : ''}${esc(r.code)}</span></div>
        </article>`;
      }).join('') ||
        `<div class="vide"><div>🔍</div><b>Aucun repas trouvé</b>Essayez de retirer un ingrédient ou une catégorie.
           <div style="font-size:inherit;margin-top:12px"><button class="btn btn-contour" onclick="toutEffacer()">Réinitialiser les filtres</button></div></div>`;

      emojis(document.querySelector('.contenu'));
    }

    // Remplace les emojis par des images Twemoji (identiques sur Windows, Mac et téléphone)
    function emojis(el) {
      if (window.twemoji && el) twemoji.parse(el, { folder: 'svg', ext: '.svg', className: 'tw' });
    }

    function voir(code) {
      const r = repas.find(x => x.code === code);
      if (!r) return;
      const [vif, pastel] = couleurs(r.nature);
      const etiquettes = s => decouper(s).map(i =>
        `<span class="${choisis.has(canon(i)) ? 'choisi' : ''}">${icone(canon(i))} ${esc(i)}</span>`).join('') || '<span>—</span>';
      document.getElementById('detail').innerHTML = `
        <div class="fenetre-tete">
          <span class="carte-ico" style="background:${pastel}">${emojiRepas(r)}</span>
          <div>
            <h2>${esc(r.libelle)}</h2>
            <p><span style="color:${vif};font-weight:600">${esc(r.nature || 'Sans catégorie')}</span> · Réf. ${esc(r.code)} · ${ingredientsDe(r).size} ingrédient(s)</p>
          </div>
          <button class="rond" onclick="fermer('fondDetail')">✕</button>
        </div>
        <div class="bloc"><h5>Ingrédients principaux</h5><div class="etiquettes">${etiquettes(r.principal)}</div></div>
        ${r.facultatif ? `<div class="bloc"><h5>Facultatifs</h5><div class="etiquettes fac">${etiquettes(r.facultatif)}</div></div>` : ''}
        ${r.astuce ? `<div class="bloc"><h5>💡 Astuce</h5><div class="texte">${esc(r.astuce)}</div></div>` : ''}
        ${r.remarque ? `<div class="bloc"><h5>📝 Remarque</h5><div class="texte">${esc(r.remarque)}</div></div>` : ''}
        <div class="actions">
          <button class="btn btn-danger gauche" onclick="supprimer('${esc(r.code)}')">Supprimer</button>
          <button class="btn btn-noir" onclick="fermer('fondDetail');ouvrirFormulaire('${esc(r.code)}')">Modifier</button>
        </div>`;
      emojis(document.getElementById('detail'));
      document.getElementById('fondDetail').classList.add('ouvert');
    }

    function ouvrirFormulaire(code) {
      const r = repas.find(x => x.code === code) || {};
      document.getElementById('titreForm').textContent = code ? 'Modifier ' + (r.libelle || code) : 'Nouveau repas';
      ['code', 'libelle', 'nature', 'principal', 'facultatif', 'astuce', 'remarque']
        .forEach(c => document.getElementById('f_' + c).value = r[c] || '');
      famillesForm = {};
      verifierDoublon();
      majNouveauxIngr();
      document.getElementById('fondForm').classList.add('ouvert');
      document.getElementById('f_libelle').focus();
    }

    function enregistrer(forcer) {
      const data = {};
      ['code', 'libelle', 'nature', 'principal', 'facultatif', 'astuce', 'remarque']
        .forEach(c => data[c] = document.getElementById('f_' + c).value);
      if (!data.libelle.trim()) { toast('Le nom du repas est obligatoire'); return; }
      // Repas au nom identique : on demande confirmation avant d'enregistrer
      const identique = ressemblants(data.libelle, data.code).identique;
      if (identique && !forcer) { afficherAlerteDoublon(identique, true); return; }
      data.forcer = !!forcer;
      // Familles choisies pour les nouveaux ingrédients
      data.familles = {};
      nouveauxIngredients().forEach(c => data.familles[c] = (famillesForm[c] || '').trim().toUpperCase());
      const btn = document.getElementById('btnEnregistrer');
      btn.disabled = true;
      serveur('enregistrerRepas', data,
        l => { btn.disabled = false; fermer('fondForm'); maj(l); toast('✓ Repas enregistré'); },
        e => {
          btn.disabled = false;
          const m = String(e && e.message || e).match(/DOUBLON\|([^|]*)\|(.*)/);
          if (m) afficherAlerteDoublon({ code: m[1], libelle: m[2] }, true);
          else erreur(e);
        });
    }

    // ---------- Doublons ----------

    // Petits mots ignorés quand on compare deux noms de repas (même liste que Code.gs)
    const MOTS_VIDES = ['a', 'au', 'aux', 'la', 'le', 'les', 'l', 'de', 'du', 'des', 'd', 'avec', 'et', 'en', 'sauce'];

    // Mots nettoyés d'un nom : sans accents ni petits mots, au singulier, synonymes remplacés
    function motsRepas(libelle) {
      const mots = norm(libelle).replace(/[^a-z0-9]+/g, ' ').split(' ')
        .filter(m => m && !MOTS_VIDES.includes(m))
        .map(m => {
          const syn = SYNONYMES[m.toUpperCase()];
          if (syn && syn.indexOf(' ') < 0) m = norm(syn);
          return m.length > 3 ? m.replace(/[sx]$/, '') : m;
        });
      return [...new Set(mots)].sort();
    }

    // Nombre de lettres à changer pour passer d'un mot à l'autre (une inversion de 2 lettres compte pour 1)
    function distance(a, b) {
      const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
      for (let j = 1; j <= b.length; j++) d[0][j] = j;
      for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
      return d[a.length][b.length];
    }

    // Deux mots « presque pareils » : tolérance selon la longueur
    function motProche(a, b) {
      const tol = Math.min(a.length, b.length) >= 6 ? 2 : Math.min(a.length, b.length) >= 4 ? 1 : 0;
      return distance(a, b) <= tol;
    }

    // Même nombre de mots et chaque mot a un « presque pareil » dans l'autre nom
    function nomsProches(m1, m2) {
      if (!m1.length || m1.length !== m2.length) return false;
      const restants = [...m2];
      return m1.every(a => {
        const i = restants.findIndex(b => motProche(a, b));
        if (i < 0) return false;
        restants.splice(i, 1);
        return true;
      });
    }

    // Repas existants identiques (niveau 1) ou proches par faute de frappe (niveau 2)
    function ressemblants(libelle, code) {
      const mots = motsRepas(libelle);
      const cle = mots.join(' ');
      let identique = null; const proches = [];
      if (!cle) return { identique, proches };
      repas.forEach(r => {
        if (code && r.code === code) return;
        const autres = motsRepas(r.libelle);
        if (autres.join(' ') === cle) identique = identique || r;
        else if (nomsProches(mots, autres)) proches.push(r);
      });
      return { identique, proches };
    }

    function afficherAlerteDoublon(r, aConfirmer) {
      document.getElementById('alerteDoublon').innerHTML = `
        <div class="alerte forte">⚠️ <span>Ce repas existe déjà : <b>${esc(r.libelle)}</b> (${esc(r.code)})</span>
          <button class="btn btn-contour" onclick="fermer('fondForm');voir('${esc(r.code)}')">Ouvrir ce repas</button>
          ${aConfirmer ? `<button class="btn btn-noir" onclick="enregistrer(true)">Enregistrer quand même</button>` : ''}
        </div>`;
    }

    // Vérification en direct pendant la frappe du nom
    function verifierDoublon() {
      const zone = document.getElementById('alerteDoublon');
      const { identique, proches } = ressemblants(document.getElementById('f_libelle').value, document.getElementById('f_code').value);
      if (identique) return afficherAlerteDoublon(identique, false);
      zone.innerHTML = proches.length ? `
        <div class="alerte douce">🤔 <span>Vouliez-vous dire ${proches.slice(0, 3).map(r =>
          `<b>${esc(r.libelle)}</b> (${esc(r.code)})`).join(', ')} ?</span>
          <button class="btn btn-contour" onclick="fermer('fondForm');voir('${esc(proches[0].code)}')">Ouvrir</button>
        </div>` : '';
    }

    // Liste des doublons déjà présents dans la feuille
    function afficherDoublons() {
      const paires = [];
      repas.forEach((a, i) => repas.slice(i + 1).forEach(b => {
        const ma = motsRepas(a.libelle), mb = motsRepas(b.libelle);
        if (ma.join(' ') === mb.join(' ')) paires.push([a, b, 'Identiques']);
        else if (nomsProches(ma, mb)) paires.push([a, b, 'Faute de frappe ?']);
      }));
      const lien = r => `<button class="pilule" onclick="voir('${esc(r.code)}')">${esc(r.libelle)} <small>${esc(r.code)}</small></button>`;
      document.getElementById('detail').innerHTML = `
        <div class="fenetre-tete">
          <div><h2>Doublons possibles</h2><p>${paires.length ? paires.length + ' paire(s) à vérifier' : 'Aucun doublon trouvé 🎉'}</p></div>
          <button class="rond" onclick="fermer('fondDetail')">✕</button>
        </div>
        ${paires.map(([a, b, type]) => `
          <div class="bloc"><h5>${type}</h5><div class="pilules">${lien(a)}${lien(b)}</div></div>`).join('')}`;
      document.getElementById('fondDetail').classList.add('ouvert');
    }

    // ---------- Familles des nouveaux ingrédients (formulaire) ----------

    let famillesForm = {};   // ingrédient -> famille choisie dans le formulaire

    // Famille proposée pour un ingrédient inconnu (mêmes règles que Code.gs)
    const FAMILLES_AUTO = [
      [/poulet|dinde|escalope|viande|steak|boeuf|agneau|mouton|kefta|merguez|poisson|thon|sardine|crevette|calamar|oeuf|burger|foie/, 'PROTÉINES'],
      [/concentr|harissa|hrous|piment|epice|cumin|poivre\b|\bsel\b|sauce|ketchup|mayonnaise|moutarde|huile|\bail\b|tabel|karouia/, 'ÉPICES & SAUCES'],
      [/fromage|lait|creme|yaourt|beurre|mozzarella|gruyere|ricotta/, 'PRODUITS LAITIERS'],
      [/pate|spaghetti|macaroni|riz|couscous|pain|baguette|pomme de terre|patate|frite|semoule|farine|mlewi|tabouna|feuille de brik/, 'FÉCULENTS'],
      [/citron|pomme\b|orange|banane|fraise|raisin|datte/, 'FRUITS'],
      [/tomate|oignon|poivron|carotte|courgette|aubergine|salade|laitue|epinard|champignon|mais|concombre|persil|coriandre|menthe|petit pois|haricot|pois chiche|lentille|feve|navet|chou|celeri|olive/, 'LÉGUMES']
    ];

    function devinerFamille(nom) {
      const f = FAMILLES_AUTO.find(([re]) => re.test(norm(nom)));
      return f ? f[1] : '';
    }

    // Toutes les familles connues (pour les listes de choix)
    function famillesConnues() {
      const toutes = FAMILLES.map(([f]) => f);
      Object.values(FAMILLE).forEach(f => { if (f && !toutes.includes(f)) toutes.push(f); });
      return toutes;
    }

    // Ingrédients du formulaire absents de l'onglet « Ingrédients »
    function nouveauxIngredients() {
      const txt = document.getElementById('f_principal').value + ' / ' + document.getElementById('f_facultatif').value;
      return [...new Set(decouper(txt).map(canon))].filter(c => !SYNONYMES[c] && !FAMILLE[c]);
    }

    function majNouveauxIngr() {
      const zone = document.getElementById('nouveauxIngr');
      document.getElementById('listeFamilles').innerHTML = famillesConnues().map(f => `<option value="${esc(f)}">`).join('');
      const nouveaux = nouveauxIngredients();
      nouveaux.forEach(c => { if (!(c in famillesForm)) famillesForm[c] = devinerFamille(c); });
      zone.innerHTML = nouveaux.length ? `
        <div class="nouveaux">
          <h5>Nouveaux ingrédients : choisissez leur famille</h5>
          ${nouveaux.map(c => `
            <div class="ligne-ingr"><span>${icone(c)} ${esc(c)}</span>
              <input list="listeFamilles" value="${esc(famillesForm[c])}" placeholder="📦 À classer"
                     oninput="famillesForm['${esc(c)}'] = this.value" autocomplete="off">
            </div>`).join('')}
        </div>` : '';
    }

    // ---------- Changer la famille d'un ingrédient (crayon ✏️) ----------

    let ingrFamille = '';

    function ouvrirFamille(c) {
      ingrFamille = c;
      document.getElementById('titreFamille').textContent = `${icone(c)} ${c}`;
      document.getElementById('nouvelleFamille').value = '';
      const actuelle = FAMILLE[c] || '';
      document.getElementById('choixFamilles').innerHTML = famillesConnues().concat(['']).map(f => `
        <button class="pilule ${f === actuelle ? 'actif' : ''}" onclick="validerFamille('${esc(f)}')">
          ${f ? emojiFamille(f) + ' ' + esc(f.charAt(0) + f.slice(1).toLowerCase()) : '📦 À classer'}</button>`).join('');
      emojis(document.getElementById('fondFamille'));
      document.getElementById('fondFamille').classList.add('ouvert');
    }

    function validerFamille(f) {
      f = String(f || '').trim().toUpperCase();
      fermer('fondFamille');
      serveur('changerFamille', [ingrFamille, f],
        l => { maj(l); toast(`✓ ${ingrFamille} → ${f || 'À classer'}`); }, erreur);
    }

    function supprimer(code) {
      const r = repas.find(x => x.code === code) || {};
      document.getElementById('texteConfirm').textContent = `« ${r.libelle || code} » sera retiré de votre Google Sheet.`;
      document.getElementById('btnConfirm').onclick = () => {
        fermer('fondConfirm');
        serveur('supprimerRepas', code,
          l => { fermer('fondDetail'); maj(l); toast('Repas supprimé'); },
          erreur);
      };
      document.getElementById('fondConfirm').classList.add('ouvert');
    }

    function aleatoire() {
      const { liste } = filtrer();
      if (!liste.length) { toast('Aucun repas disponible'); return; }
      voir(liste[Math.floor(Math.random() * liste.length)].code);
    }

    function fermer(id) { document.getElementById(id).classList.remove('ouvert'); }

    function toast(t) {
      const m = document.getElementById('message');
      m.textContent = t; m.classList.add('visible');
      clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('visible'), 2800);
    }

    function erreur(e) { toast('Erreur : ' + (e && e.message ? e.message : e)); }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') ['fondDetail', 'fondForm', 'fondConfirm', 'fondFamille'].forEach(fermer);
    });

    charger();
  </script>
</body>
</html>
