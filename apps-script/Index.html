<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --violet: #6c5ce7; --violet-2: #8b7cf8; --rose: #fd79a8; --orange: #ffa94d;
      --vert: #10b981; --vert-fonce: #059669; --rouge: #ef4444;
      --texte: #1e1b4b; --texte-2: #64748b; --texte-3: #94a3b8;
      --fond: #f5f3ff; --carte: #ffffff; --bord: #ece9fb;
      --ombre: 0 1px 2px rgba(30,27,75,.04), 0 8px 24px rgba(108,92,231,.08);
      --ombre-fort: 0 4px 10px rgba(30,27,75,.06), 0 20px 40px rgba(108,92,231,.18);
      --rayon: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--texte);
      background: radial-gradient(circle at 0% 0%, #ede9fe 0, transparent 40%),
                  radial-gradient(circle at 100% 0%, #fce7f3 0, transparent 35%), var(--fond);
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    .page { max-width: 1400px; margin: 0 auto; padding: 14px 16px 40px; }
    .espace { flex: 1; }
    [hidden] { display: none !important; }
    img.tw { width: 1.15em; height: 1.15em; vertical-align: -0.2em; }

    /* ---------- Barre de menu ---------- */
    .navbar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.85); backdrop-filter: blur(12px);
              border-bottom: 1px solid var(--bord); box-shadow: 0 1px 10px rgba(108,92,231,.06); }
    .navbar-int { max-width: 1400px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .marque { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 19px;
            background: linear-gradient(135deg, var(--violet), var(--rose)); box-shadow: 0 4px 12px rgba(108,92,231,.35); }
    .marque h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.02em;
                 background: linear-gradient(135deg, var(--violet), var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .navbar .champ { flex: 1; position: relative; min-width: 0; }
    .navbar .champ svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--texte-3); }
    .navbar .champ input { width: 100%; padding: 9px 12px 9px 38px; border-radius: 10px; border: 1.5px solid var(--bord);
                           background: #f8f7fd; outline: none; font-size: 14px; transition: all .15s; }
    .navbar .champ input:focus { border-color: var(--violet-2); background: #fff; box-shadow: 0 0 0 4px rgba(108,92,231,.12); }
    .navbar .segment { display: inline-flex; background: #f1f0fb; border-radius: 10px; padding: 3px; flex-shrink: 0; }
    .navbar .segment button { padding: 6px 11px; border-radius: 8px; font-weight: 600; font-size: 12px; color: var(--texte-2); }
    .navbar .segment button.actif { background: #fff; color: var(--violet); box-shadow: 0 2px 6px rgba(30,27,75,.1); }
    .navbar .btn { padding: 9px 14px; font-size: 13px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 11px 18px; border-radius: 12px;
           font-weight: 700; font-size: 14px; transition: transform .15s, box-shadow .15s, background .15s; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primaire { color: #fff; background: linear-gradient(135deg, var(--violet), var(--violet-2));
                    box-shadow: 0 6px 16px rgba(108,92,231,.35); }
    .btn-primaire:hover { box-shadow: 0 10px 22px rgba(108,92,231,.45); }
    .btn-blanc { background: #fff; border: 1px solid var(--bord); box-shadow: var(--ombre); }
    .btn-danger { color: #fff; background: var(--rouge); }
    .btn-doux { background: #f1f0fb; color: var(--texte); }
    .btn[disabled] { opacity: .6; pointer-events: none; }

    /* ---------- Filtres compacts ---------- */
    .filtres { background: var(--carte); border-radius: 14px; padding: 10px 14px 6px; box-shadow: var(--ombre);
               border: 1px solid var(--bord); margin-bottom: 14px; }
    .filtres .ligne { display: flex; gap: 12px; align-items: flex-start; padding: 4px 0; }
    .libelle-ligne { flex: 0 0 96px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
                     color: var(--texte-3); padding-top: 8px; }
    .libelle-ligne .compteur { display: inline-block; margin-top: 4px; text-transform: none; letter-spacing: 0; }
    .filtres .natures, .filtres .puces { flex: 1; min-width: 0; }
    .filtres .nature { padding: 6px 12px; font-size: 12px; }
    .filtres .puce { padding: 4px 11px 4px 4px; font-size: 12px; gap: 5px; }
    .filtres .puce .ico { width: 22px; height: 22px; font-size: 13px; }
    .puces.replie { max-height: 68px; overflow: hidden; }
    .filtres-pied { display: flex; align-items: center; border-top: 1px dashed var(--bord); margin-top: 4px; padding-top: 2px; }
    .filtres-pied .lien { font-size: 12px; padding: 5px 8px; }

    .compteur { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #d1fae5; color: var(--vert-fonce); }
    .lien { font-weight: 700; color: var(--violet); border-radius: 8px; }
    .lien:hover { background: #f1f0fb; }
    .natures { display: flex; gap: 6px; flex-wrap: wrap; }
    .nature { padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; background: #f4f3fb; color: var(--texte-2);
              border: 1.5px solid transparent; transition: all .15s; }
    .nature:hover { border-color: #d9d4fb; }
    .nature.actif { background: var(--texte); color: #fff; }
    .nature small { opacity: .6; margin-left: 4px; }

    .puces { display: flex; flex-wrap: wrap; gap: 6px; }
    .puce { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px 8px 8px; border-radius: 999px;
            background: #f4f4f6; color: #8a8fa3; font-size: 13px; font-weight: 600; border: 1.5px solid #ececf1; transition: all .18s; }
    .puce .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 16px;
                 background: #fff; filter: grayscale(80%); transition: filter .18s; }
    .puce:hover { border-color: #a7f3d0; color: var(--texte); transform: translateY(-1px); }
    .puce:hover .ico { filter: none; }
    .puce.actif { background: linear-gradient(135deg, var(--vert), #34d399); color: #fff; border-color: var(--vert);
                  box-shadow: 0 6px 14px rgba(16,185,129,.35); }
    .puce.actif .ico { filter: none; }
    .puce.actif::after { content: '✓'; font-weight: 800; margin-left: 2px; }
    .puce.impossible { opacity: .35; }
    .puce.impossible:hover { transform: none; }

    /* ---------- Résultats ---------- */
    .resultats-tete { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 10px; gap: 10px; flex-wrap: wrap; }
    .resultats-tete h3 { margin: 0; font-size: 15px; font-weight: 800; }
    .resultats-tete span { color: var(--texte-2); font-size: 12px; }
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .carte { background: var(--carte); border-radius: 14px; overflow: hidden; box-shadow: var(--ombre); border: 1px solid var(--bord);
             cursor: pointer; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column;
             animation: apparait .35s ease both; }
    .carte:hover { transform: translateY(-4px); box-shadow: var(--ombre-fort); }
    @keyframes apparait { from { opacity: 0; transform: translateY(8px); } }
    .carte-visuel { height: 62px; position: relative; display: grid; place-items: center; }
    .carte-visuel .emoji { font-size: 34px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.18)); transition: transform .25s; }
    .carte:hover .emoji { transform: scale(1.12) rotate(-6deg); }
    .etiquette { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 800;
                 background: rgba(255,255,255,.9); letter-spacing: .03em; }
    .code { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,.95);
            background: rgba(0,0,0,.15); padding: 3px 6px; border-radius: 6px; }
    .carte-corps { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
    .carte-corps h4 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
    .carte .ingr { gap: 4px; }
    .carte .ingr span { font-size: 11px; padding: 2px 7px; }
    .carte .astuce { font-size: 11px; padding: 5px 8px; }
    .ingr { display: flex; flex-wrap: wrap; gap: 6px; }
    .ingr span { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 8px; background: #f5f5fa; color: #525a72; }
    .ingr span.choisi { background: #d1fae5; color: var(--vert-fonce); }
    .ingr.fac span { background: #fff; border: 1px dashed #d4d4e0; color: var(--texte-2); }
    .astuce { margin-top: auto; font-size: 12px; color: #92400e; background: #fffbeb; border-radius: 10px; padding: 8px 10px; }
    mark { background: #fde68a; color: inherit; border-radius: 3px; padding: 0 1px; }
    .vide { grid-column: 1 / -1; text-align: center; padding: 50px 20px; background: var(--carte); border-radius: 20px;
            border: 2px dashed var(--bord); color: var(--texte-2); }
    .vide div { font-size: 46px; margin-bottom: 8px; }
    .vide b { display: block; color: var(--texte); font-size: 16px; margin-bottom: 4px; }

    /* ---------- Fenêtres ---------- */
    .fond { position: fixed; inset: 0; background: rgba(30,27,75,.45); backdrop-filter: blur(6px); display: none;
            align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .fond.ouvert { display: flex; animation: fondu .2s ease; }
    @keyframes fondu { from { opacity: 0; } }
    .fenetre { background: #fff; border-radius: 24px; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
               box-shadow: 0 30px 60px rgba(30,27,75,.3); animation: monte .25s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes monte { from { opacity: 0; transform: translateY(20px) scale(.97); } }
    .fenetre-visuel { height: 150px; display: grid; place-items: center; position: relative; }
    .fenetre-visuel .emoji { font-size: 74px; filter: drop-shadow(0 10px 16px rgba(0,0,0,.2)); }
    .fermer-x { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%;
                background: rgba(255,255,255,.9); font-size: 16px; font-weight: 700; }
    .fenetre-corps { padding: 22px 24px 24px; }
    .fenetre-corps h2 { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .sous-titre { color: var(--texte-2); font-size: 13px; margin-bottom: 18px; }
    .bloc { margin-bottom: 16px; }
    .bloc h5 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--texte-3); }
    .bloc .texte { background: #f8f7fd; border-radius: 12px; padding: 12px; font-size: 14px; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }
    .actions .gauche { margin-right: auto; }

    .form label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
    .form input, .form textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--bord);
                                  background: #fafaff; outline: none; transition: border .15s, box-shadow .15s; resize: vertical; }
    .form input:focus, .form textarea:focus { border-color: var(--violet-2); box-shadow: 0 0 0 4px rgba(108,92,231,.12); background: #fff; }
    .form .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .aide { font-size: 12px; color: var(--texte-3); margin-top: 5px; }

    /* ---------- Notification ---------- */
    #message { position: fixed; bottom: 22px; right: 22px; background: var(--texte); color: #fff; padding: 13px 18px; border-radius: 14px;
               font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px rgba(30,27,75,.3); z-index: 20;
               transform: translateY(120px); opacity: 0; transition: all .3s cubic-bezier(.2,.9,.3,1.2); }
    #message.visible { transform: none; opacity: 1; }

    @media (max-width: 1000px) { .navbar .btn .txt { display: none; } }
    @media (max-width: 760px) {
      .navbar-int { flex-wrap: wrap; gap: 8px; }
      .marque h1 { display: none; }
      .navbar .champ { order: 5; flex-basis: 100%; }
      .navbar .segment { margin-right: auto; }
      .filtres .ligne { flex-direction: column; gap: 4px; }
      .libelle-ligne { flex: none; padding-top: 0; }
      .grille { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
      .form .deux { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-int">
      <div class="marque"><div class="logo">🍽️</div><h1>Idée Repas</h1></div>
      <div class="champ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="recherche" placeholder="Rechercher un plat ou un ingrédient…" oninput="afficher()" autocomplete="off">
      </div>
      <div class="segment" id="mode">
        <button data-mode="tout" class="actif" onclick="choisirMode('tout')">Tout</button>
        <button data-mode="nom" onclick="choisirMode('nom')">Nom</button>
        <button data-mode="ingr" onclick="choisirMode('ingr')">Ingrédients</button>
      </div>
      <button class="btn btn-blanc" onclick="aleatoire()" title="Idée au hasard">🎲<span class="txt"> Surprends-moi</span></button>
      <button class="btn btn-primaire" onclick="ouvrirFormulaire()" title="Nouveau repas">＋<span class="txt"> Nouveau</span></button>
    </div>
  </nav>

  <div class="page">

    <section class="filtres">
      <div class="ligne">
        <span class="libelle-ligne">Catégorie</span>
        <div class="natures" id="natures"></div>
      </div>
      <div class="ligne">
        <span class="libelle-ligne">Ingrédients <span class="compteur" id="nbChoisis" hidden></span></span>
        <div class="puces replie" id="puces"></div>
      </div>
      <div class="filtres-pied">
        <button class="lien" id="btnPlus" onclick="basculerPlus()" hidden>Voir tous les ingrédients ▾</button>
        <span class="espace"></span>
        <button class="lien" onclick="toutEffacer()">↺ Réinitialiser</button>
      </div>
    </section>

    <div class="resultats-tete">
      <h3 id="titreRes">Tous les repas</h3>
      <span id="info">Chargement…</span>
    </div>
    <div class="grille" id="liste"></div>
  </div>

  <!-- Détail -->
  <div class="fond" id="fondDetail" onclick="if(event.target===this)fermer('fondDetail')">
    <div class="fenetre" id="detail"></div>
  </div>

  <!-- Formulaire -->
  <div class="fond" id="fondForm" onclick="if(event.target===this)fermer('fondForm')">
    <div class="fenetre">
      <div class="fenetre-corps form">
        <h2 id="titreForm">Nouveau repas</h2>
        <div class="sous-titre">Les informations sont enregistrées directement dans votre Google Sheet.</div>
        <input type="hidden" id="f_code">
        <div class="deux">
          <div>
            <label>Nom du repas *</label>
            <input id="f_libelle" placeholder="Ex : COUSCOUS AU POULET">
          </div>
          <div>
            <label>Catégorie</label>
            <input id="f_nature" list="listeNatures" placeholder="REPAS, FAST FOOD…">
            <datalist id="listeNatures"></datalist>
          </div>
        </div>
        <label>🥘 Ingrédients principaux</label>
        <textarea id="f_principal" rows="2" placeholder="TOMATE / OIGNON / POULET"></textarea>
        <div class="aide">Séparez les ingrédients par « / » ou « - »</div>
        <label>➕ Ingrédients facultatifs</label>
        <textarea id="f_facultatif" rows="2"></textarea>
        <label>💡 Astuce</label>
        <textarea id="f_astuce" rows="2"></textarea>
        <label>📝 Remarque</label>
        <textarea id="f_remarque" rows="2"></textarea>
        <div class="actions">
          <button class="btn btn-doux" onclick="fermer('fondForm')">Annuler</button>
          <button class="btn btn-primaire" id="btnEnregistrer" onclick="enregistrer()">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmation -->
  <div class="fond" id="fondConfirm" onclick="if(event.target===this)fermer('fondConfirm')">
    <div class="fenetre" style="max-width:400px">
      <div class="fenetre-corps" style="text-align:center">
        <div style="font-size:48px">🗑️</div>
        <h2>Supprimer ce repas ?</h2>
        <div class="sous-titre" id="texteConfirm"></div>
        <div class="actions" style="justify-content:center">
          <button class="btn btn-doux" onclick="fermer('fondConfirm')">Annuler</button>
          <button class="btn btn-danger" id="btnConfirm">Supprimer</button>
        </div>
      </div>
    </div>
  </div>

  <div id="message"></div>

  <script>
    let repas = [];
    let mode = 'tout';
    let natureChoisie = '';

    // Hors de Google Sheets (aperçu du fichier), on utilise des données de démonstration
    const DEMO = typeof google === 'undefined' || !google.script;
    let demo = [
      { code: 'R001', nature: 'REPAS', libelle: 'MOSLI AZ3AR AU POULET', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL - POULET / DJEJ', facultatif: '', astuce: 'FAIRE ROUGIR AU FOUR', remarque: '' },
      { code: 'R002', nature: 'REPAS', libelle: 'TCHICH AU POISSON', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL / POISSON', facultatif: '', astuce: '', remarque: '' },
      { code: 'R003', nature: 'REPAS', libelle: 'TCHALWICHA', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL', facultatif: '', astuce: '', remarque: '' },
      { code: 'R004', nature: 'FAST FOOD', libelle: 'HAMBURGER', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL / BURGER', facultatif: '', astuce: '', remarque: '' },
      { code: 'R005', nature: 'FAST FOOD', libelle: 'PIZZA', principal: 'TOMATE / THON / OEUF', facultatif: 'FROMAGE', astuce: '', remarque: '' },
      { code: 'R006', nature: 'REPAS', libelle: 'M7AMMAR - MHAMMAR', principal: 'HROUS / STEAK SANS OS / TOMATE CONCENTRE', facultatif: '', astuce: '', remarque: '' }
    ];
    const demoServeur = {
      getRepas: () => demo,
      enregistrerRepas: r => {
        const i = demo.findIndex(x => x.code === r.code);
        const max = demo.reduce((m, x) => Math.max(m, parseInt(x.code.replace(/\D/g, ''), 10) || 0), 0);
        const n = {};
        Object.keys(r).forEach(k => n[k] = String(r[k] || '').trim().toUpperCase());
        n.code = i >= 0 ? demo[i].code : 'R' + String(max + 1).padStart(3, '0');
        if (i >= 0) demo[i] = n; else demo.push(n);
        return demo;
      },
      supprimerRepas: code => (demo = demo.filter(x => x.code !== code))
    };

    // Appelle une fonction de Code.gs (ou sa version démo)
    function serveur(fn, arg, ok, ko) {
      if (DEMO) {
        try { ok(JSON.parse(JSON.stringify(demoServeur[fn](arg)))); } catch (e) { ko(e); }
        return;
      }
      google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](arg);
    }

    function charger() {
      emojis(document.body);
      document.getElementById('liste').innerHTML = '<div class="vide"><div>⏳</div><b>Chargement des repas…</b></div>';
      serveur('getRepas', undefined, maj, erreur);
      if (DEMO) toast('Mode démo : vos vraies données s’affichent dans Google Sheets');
    }

    function maj(liste) {
      repas = liste || [];
      const natures = [...new Set(repas.map(r => r.nature).filter(Boolean))].sort();
      if (natureChoisie && !natures.includes(natureChoisie)) natureChoisie = '';
      document.getElementById('listeNatures').innerHTML = natures.map(n => `<option value="${esc(n)}">`).join('');
      afficher();
    }

    // ---------- Outils ----------

    // Supprime accents et met en minuscules pour une recherche tolérante
    function norm(s) {
      return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function decouper(s) {
      return String(s || '').split(/\s*[\/\-,;]\s*/).map(x => x.trim()).filter(Boolean);
    }

    function surligner(texte, termes) {
      let h = esc(texte);
      termes.forEach(t => {
        if (!t) return;
        const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        h = h.replace(re, '<mark>$1</mark>');
      });
      return h;
    }

    // ---------- Couleurs et emojis ----------

    const DEGRADES = [
      ['#a78bfa', '#f472b6'], ['#fb923c', '#facc15'], ['#34d399', '#22d3ee'],
      ['#60a5fa', '#a78bfa'], ['#f472b6', '#fb7185'], ['#4ade80', '#a3e635']
    ];

    function degrade(nature) {
      let h = 0;
      for (const ch of String(nature || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      const [a, b] = DEGRADES[h % DEGRADES.length];
      return `linear-gradient(135deg, ${a}, ${b})`;
    }

    // Emoji du plat d'après son nom, sinon d'après sa catégorie
    const PLATS = [
      [/pizza/, '🍕'], [/burger/, '🍔'], [/sandwich|chapati|makloub|libanais/, '🥪'], [/tacos|wrap/, '🌯'],
      [/salade/, '🥗'], [/soupe|chorba|lablabi/, '🍲'], [/couscous|riz/, '🍛'], [/pate|spaghetti|macaroni|lasagne/, '🍝'],
      [/poisson|thon|sardine/, '🐟'], [/poulet|djej/, '🍗'], [/frite/, '🍟'], [/oeuf|ojja|omelette/, '🍳'],
      [/brik/, '🥟'], [/gateau|dessert|tarte/, '🍰'], [/viande|mhammar|m7ammar|kefta|steak/, '🥩']
    ];

    function emojiRepas(r) {
      const n = norm(r.libelle);
      const p = PLATS.find(([re]) => re.test(n));
      if (p) return p[1];
      return /fast/.test(norm(r.nature)) ? '🍟' : '🥘';
    }

    // ---------- Ingrédients : synonymes et icônes ----------

    // Nom en dialecte -> nom de référence (ajoutez-en ici si besoin)
    const SYNONYMES = { BSAL: 'OIGNON', FILFIL: 'POIVRON', DJEJ: 'POULET', HOUT: 'POISSON', ADHAM: 'OEUF', JBEN: 'FROMAGE', BATATA: 'POMME DE TERRE' };

    // Le premier motif qui correspond donne l'icône (l'ordre compte)
    const ICONES = [
      [/tomate concentr/, '🥫'], [/tomate/, '🍅'], [/oignon/, '🧅'], [/\bail\b/, '🧄'],
      [/poivron/, '🫑'], [/piment|harissa|hrous/, '🌶️'], [/poulet|dinde/, '🍗'],
      [/poisson|thon|sardine|merou|dorade/, '🐟'], [/crevette|fruits de mer|calamar/, '🦐'],
      [/burger/, '🍔'], [/steak|viande|boeuf|agneau|mouton|kefta|merguez/, '🥩'],
      [/oeuf/, '🥚'], [/fromage|mozzarella|gruyere/, '🧀'], [/pomme de terre|patate|frite/, '🥔'],
      [/carotte/, '🥕'], [/pain|baguette|mlewi|tabouna/, '🥖'], [/riz/, '🍚'],
      [/pate|spaghetti|macaroni|couscous|nouille/, '🍝'], [/citron/, '🍋'], [/olive|huile/, '🫒'],
      [/lait|creme/, '🥛'], [/persil|coriandre|menthe|basilic/, '🌿'], [/salade|laitue|epinard/, '🥬'],
      [/champignon/, '🍄'], [/mais/, '🌽'], [/aubergine/, '🍆'], [/courgette|concombre/, '🥒'],
      [/pois chiche|lentille|haricot|feve/, '🫘'], [/sel\b|epice|cumin|poivre\b/, '🧂']
    ];

    function canon(i) { const u = i.toUpperCase(); return SYNONYMES[u] || u; }

    function icone(nom) {
      const n = norm(nom);
      const trouve = ICONES.find(([re]) => re.test(n));
      return trouve ? trouve[1] : '🥄';
    }

    // Ensemble des ingrédients (noms de référence) d'un repas
    function ingredientsDe(r) {
      return new Set(decouper(r.principal + ' / ' + r.facultatif).map(canon));
    }

    // Libellé d'une puce : nom de référence + synonymes trouvés dans la feuille
    let libellesIngr = {};
    let choisis = new Set();

    function construirePuces() {
      const compte = {};
      libellesIngr = {};
      repas.forEach(r => decouper(r.principal + ' / ' + r.facultatif).forEach(brut => {
        const c = canon(brut);
        (libellesIngr[c] = libellesIngr[c] || new Set([c])).add(brut.toUpperCase());
      }));
      repas.forEach(r => ingredientsDe(r).forEach(c => compte[c] = (compte[c] || 0) + 1));
      // On retire des choix les ingrédients qui n'existent plus
      choisis = new Set([...choisis].filter(c => compte[c]));
      return Object.keys(compte).sort((a, b) => compte[b] - compte[a] || a.localeCompare(b));
    }

    function basculer(c) {
      choisis.has(c) ? choisis.delete(c) : choisis.add(c);
      afficher();
    }

    function choisirNature(n) { natureChoisie = n; afficher(); }

    function choisirMode(m) {
      mode = m;
      document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('actif', b.dataset.mode === m));
      afficher();
    }

    function toutEffacer() {
      choisis.clear();
      natureChoisie = '';
      document.getElementById('recherche').value = '';
      afficher();
    }

    // Ingrédients sans doublons de synonymes (OIGNON / BSAL -> OIGNON), pour des cartes compactes
    function uniques(s) { return [...new Set(decouper(s).map(canon))]; }

    function puceIngr(i, termes) {
      const c = canon(i);
      return `<span class="${choisis.has(c) ? 'choisi' : ''}">${icone(c)} ${surligner(i, termes)}</span>`;
    }

    // ---------- Filtrage et affichage ----------

    function filtrer() {
      const termes = norm(document.getElementById('recherche').value).split(/\s+/).filter(Boolean);
      return {
        termes,
        liste: repas.filter(r => {
          if (natureChoisie && r.nature !== natureChoisie) return false;
          const sesIngr = ingredientsDe(r);
          if (![...choisis].every(c => sesIngr.has(c))) return false;
          const nom = norm(r.libelle + ' ' + r.code);
          const ingr = norm(r.principal + ' ' + r.facultatif);
          const cible = mode === 'nom' ? nom : mode === 'ingr' ? ingr : nom + ' ' + ingr + ' ' + norm(r.astuce + ' ' + r.remarque);
          return termes.every(t => cible.includes(t));
        })
      };
    }

    function afficherNatures() {
      const compte = {};
      repas.forEach(r => { if (r.nature) compte[r.nature] = (compte[r.nature] || 0) + 1; });
      const bouton = (val, txt, nb) =>
        `<button class="nature ${natureChoisie === val ? 'actif' : ''}" onclick="choisirNature('${esc(val)}')">${txt}<small>${nb}</small></button>`;
      document.getElementById('natures').innerHTML = bouton('', '✨ Toutes', repas.length) +
        Object.keys(compte).sort().map(n => bouton(n, esc(n), compte[n])).join('');
      return Object.keys(compte).length;
    }

    function afficherPuces(resultats, tous) {
      // Ingrédients présents dans au moins un des résultats actuels
      const possibles = new Set();
      resultats.forEach(r => ingredientsDe(r).forEach(c => possibles.add(c)));
      document.getElementById('puces').innerHTML = tous.map(c => {
        const classe = choisis.has(c) ? 'actif' : possibles.has(c) ? '' : 'impossible';
        const libelle = [...libellesIngr[c]].join(' / ');
        return `<button class="puce ${classe}" onclick="basculer('${esc(c)}')" title="${esc(libelle)}">
                  <span class="ico">${icone(c)}</span>${esc(libelle)}</button>`;
      }).join('') || '<span class="aide">Aucun ingrédient pour l’instant.</span>';
      const badge = document.getElementById('nbChoisis');
      badge.hidden = !choisis.size;
      badge.textContent = choisis.size + ' choisi' + (choisis.size > 1 ? 's' : '');
    }

    function afficher() {
      const tous = construirePuces();
      const { termes, liste } = filtrer();
      afficherNatures();
      afficherPuces(liste, tous);

      const filtre = termes.length || choisis.size || natureChoisie;
      document.getElementById('titreRes').textContent = filtre ? 'Résultats' : 'Tous les repas';
      document.getElementById('info').textContent = `${liste.length} sur ${repas.length} repas`;

      document.getElementById('liste').innerHTML = liste.map((r, n) => `
        <article class="carte" style="animation-delay:${Math.min(n, 12) * 30}ms" onclick="voir('${esc(r.code)}')">
          <div class="carte-visuel" style="background:${degrade(r.nature)}">
            <span class="etiquette">${esc(r.nature || 'SANS CATÉGORIE')}</span>
            <span class="code">${esc(r.code)}</span>
            <span class="emoji">${emojiRepas(r)}</span>
          </div>
          <div class="carte-corps">
            <h4>${surligner(r.libelle, termes)}</h4>
            <div class="ingr">${uniques(r.principal).map(i => puceIngr(i, termes)).join('')}</div>
            ${r.facultatif ? `<div class="ingr fac">${uniques(r.facultatif).map(i => puceIngr(i, termes)).join('')}</div>` : ''}
            ${r.astuce ? `<div class="astuce">💡 ${surligner(r.astuce, termes)}</div>` : ''}
          </div>
        </article>`).join('') ||
        `<div class="vide"><div>🔍</div><b>Aucun repas trouvé</b>Essayez de retirer un ingrédient ou une catégorie.
           <div style="font-size:inherit;margin-top:14px"><button class="btn btn-doux" onclick="toutEffacer()">Réinitialiser les filtres</button></div></div>`;
      majPlus();
      emojis(document.getElementById('natures'));
      emojis(document.getElementById('puces'));
      emojis(document.getElementById('liste'));
    }

    // Affiche « Voir tous les ingrédients » seulement si la liste dépasse 2 lignes
    let plusOuvert = false;
    function majPlus() {
      const p = document.getElementById('puces'), b = document.getElementById('btnPlus');
      p.classList.add('replie');
      const deborde = p.scrollHeight > p.clientHeight + 2;
      p.classList.toggle('replie', !plusOuvert);
      b.hidden = !deborde;
      b.textContent = plusOuvert ? 'Réduire ▴' : 'Voir tous les ingrédients ▾';
    }
    function basculerPlus() { plusOuvert = !plusOuvert; majPlus(); }
    window.addEventListener('resize', majPlus);

    // Remplace les emojis par des images Twemoji (identiques sur Windows, Mac et téléphone)
    function emojis(el) {
      if (window.twemoji && el) twemoji.parse(el, { folder: 'svg', ext: '.svg', className: 'tw' });
    }

    function voir(code) {
      const r = repas.find(x => x.code === code);
      if (!r) return;
      const liste = s => decouper(s).map(i => puceIngr(i, [])).join('') || '<span>—</span>';
      document.getElementById('detail').innerHTML = `
        <div class="fenetre-visuel" style="background:${degrade(r.nature)}">
          <span class="etiquette">${esc(r.nature || 'SANS CATÉGORIE')}</span>
          <button class="fermer-x" onclick="fermer('fondDetail')">✕</button>
          <span class="emoji">${emojiRepas(r)}</span>
        </div>
        <div class="fenetre-corps">
          <h2>${esc(r.libelle)}</h2>
          <div class="sous-titre">Réf. ${esc(r.code)} · ${ingredientsDe(r).size} ingrédient(s)</div>
          <div class="bloc"><h5>🥘 Ingrédients principaux</h5><div class="ingr">${liste(r.principal)}</div></div>
          ${r.facultatif ? `<div class="bloc"><h5>➕ Facultatifs</h5><div class="ingr fac">${liste(r.facultatif)}</div></div>` : ''}
          ${r.astuce ? `<div class="bloc"><h5>💡 Astuce</h5><div class="texte">${esc(r.astuce)}</div></div>` : ''}
          ${r.remarque ? `<div class="bloc"><h5>📝 Remarque</h5><div class="texte">${esc(r.remarque)}</div></div>` : ''}
          <div class="actions">
            <button class="btn btn-doux gauche" style="color:var(--rouge)" onclick="supprimer('${esc(r.code)}')">🗑️ Supprimer</button>
            <button class="btn btn-primaire" onclick="fermer('fondDetail');ouvrirFormulaire('${esc(r.code)}')">✏️ Modifier</button>
          </div>
        </div>`;
      emojis(document.getElementById('detail'));
      document.getElementById('fondDetail').classList.add('ouvert');
    }

    function ouvrirFormulaire(code) {
      const r = repas.find(x => x.code === code) || {};
      document.getElementById('titreForm').textContent = code ? '✏️ Modifier ' + (r.libelle || code) : '✨ Nouveau repas';
      ['code', 'libelle', 'nature', 'principal', 'facultatif', 'astuce', 'remarque']
        .forEach(c => document.getElementById('f_' + c).value = r[c] || '');
      document.getElementById('fondForm').classList.add('ouvert');
      document.getElementById('f_libelle').focus();
    }

    function enregistrer() {
      const data = {};
      ['code', 'libelle', 'nature', 'principal', 'facultatif', 'astuce', 'remarque']
        .forEach(c => data[c] = document.getElementById('f_' + c).value);
      if (!data.libelle.trim()) { toast('⚠️ Le nom du repas est obligatoire'); return; }
      const btn = document.getElementById('btnEnregistrer');
      btn.disabled = true;
      serveur('enregistrerRepas', data,
        l => { btn.disabled = false; fermer('fondForm'); maj(l); toast('✅ Repas enregistré'); },
        e => { btn.disabled = false; erreur(e); });
    }

    function supprimer(code) {
      const r = repas.find(x => x.code === code) || {};
      document.getElementById('texteConfirm').textContent = `« ${r.libelle || code} » sera retiré de votre Google Sheet.`;
      document.getElementById('btnConfirm').onclick = () => {
        fermer('fondConfirm');
        serveur('supprimerRepas', code,
          l => { fermer('fondDetail'); maj(l); toast('🗑️ Repas supprimé'); },
          erreur);
      };
      document.getElementById('fondConfirm').classList.add('ouvert');
    }

    function aleatoire() {
      const { liste } = filtrer();
      if (!liste.length) { toast('Aucun repas disponible'); return; }
      voir(liste[Math.floor(Math.random() * liste.length)].code);
    }

    function fermer(id) { document.getElementById(id).classList.remove('ouvert'); }

    function toast(t) {
      const m = document.getElementById('message');
      m.textContent = t; m.classList.add('visible');
      clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('visible'), 2800);
    }

    function erreur(e) { toast('❌ Erreur : ' + (e && e.message ? e.message : e)); }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') ['fondDetail', 'fondForm', 'fondConfirm'].forEach(fermer);
    });

    charger();
  </script>
</body>
</html>
