<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 12px; background: #f6f7fb; color: #222; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .barre { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    input, select, textarea, button { font: inherit; padding: 8px 10px; border: 1px solid #ccd; border-radius: 6px; }
    #recherche { flex: 1 1 220px; }
    button { cursor: pointer; background: #fff; }
    button.principal { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    button.danger { background: #d93025; color: #fff; border-color: #d93025; }
    .info { font-size: 13px; color: #666; margin-bottom: 8px; }
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .carte { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); cursor: pointer; }
    .carte:hover { box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .carte h3 { margin: 4px 0 8px; font-size: 16px; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e8f0fe; color: #1a73e8; margin-right: 6px; }
    .code { font-size: 11px; color: #888; }
    .ingr { display: flex; flex-wrap: wrap; gap: 4px; }
    .ingr span { font-size: 12px; background: #fdecea; color: #a50e0e; padding: 2px 8px; border-radius: 10px; }
    .ingr.fac span { background: #e6f4ea; color: #137333; }
    mark { background: #ffe58a; }
    .filtres-ingr { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .filtres-ingr .titre { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .filtres-ingr .titre button { padding: 4px 10px; font-size: 12px; }
    .puces { display: flex; flex-wrap: wrap; gap: 6px; }
    .puce { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd;
            background: #f1f3f4; color: #777; font-size: 13px; transition: all .15s; }
    .puce .ico { font-size: 18px; filter: grayscale(70%); }
    .puce:hover { border-color: #34a853; }
    .puce.actif { background: #34a853; border-color: #2d8e47; color: #fff; font-weight: bold; }
    .puce.actif .ico { filter: none; }
    .puce.impossible { opacity: .35; }
    .fond { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; padding: 12px; }
    .fond.ouvert { display: flex; }
    .fenetre { background: #fff; border-radius: 10px; padding: 18px; width: 100%; max-width: 560px; max-height: 95vh; overflow: auto; }
    .fenetre h2 { margin-top: 0; }
    .fenetre label { display: block; font-size: 13px; font-weight: bold; margin: 10px 0 4px; }
    .fenetre input, .fenetre select, .fenetre textarea { width: 100%; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .detail p { margin: 6px 0; }
    .aide { font-size: 12px; color: #666; }
    #message { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 16px; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <h1>🍽️ Gestionnaire de repas</h1>

  <div class="barre">
    <input id="recherche" placeholder="Rechercher un repas ou un ingrédient (ex : pizza, poulet, thon...)" oninput="afficher()">
    <select id="filtreNature" onchange="afficher()"><option value="">Toutes les natures</option></select>
    <select id="mode" onchange="afficher()">
      <option value="tout">Nom + ingrédients</option>
      <option value="nom">Nom uniquement</option>
      <option value="ingr">Ingrédients uniquement</option>
    </select>
    <button class="principal" onclick="ouvrirFormulaire()">+ Ajouter</button>
    <button onclick="aleatoire()">🎲 Idée au hasard</button>
  </div>

  <div class="filtres-ingr">
    <div class="titre">
      <span>🥕 Choisir les ingrédients</span>
      <button onclick="toutEffacer()">✖ Tout effacer</button>
    </div>
    <div class="puces" id="puces"></div>
  </div>

  <div class="info" id="info">Chargement…</div>
  <div class="grille" id="liste"></div>

  <!-- Détail -->
  <div class="fond" id="fondDetail" onclick="if(event.target===this)fermer('fondDetail')">
    <div class="fenetre detail" id="detail"></div>
  </div>

  <!-- Formulaire -->
  <div class="fond" id="fondForm" onclick="if(event.target===this)fermer('fondForm')">
    <div class="fenetre">
      <h2 id="titreForm">Nouveau repas</h2>
      <input type="hidden" id="f_code">
      <label>Nom du repas *</label>
      <input id="f_libelle">
      <label>Nature</label>
      <input id="f_nature" list="natures" placeholder="REPAS, FAST FOOD…">
      <datalist id="natures"></datalist>
      <label>Ingrédients principaux</label>
      <textarea id="f_principal" rows="2"></textarea>
      <div class="aide">Séparer par « / » ou « - » (ex : TOMATE / OIGNON / POULET)</div>
      <label>Ingrédients facultatifs</label>
      <textarea id="f_facultatif" rows="2"></textarea>
      <label>Astuce</label>
      <textarea id="f_astuce" rows="2"></textarea>
      <label>Remarque</label>
      <textarea id="f_remarque" rows="2"></textarea>
      <div class="actions">
        <button onclick="fermer('fondForm')">Annuler</button>
        <button class="principal" id="btnEnregistrer" onclick="enregistrer()">Enregistrer</button>
      </div>
    </div>
  </div>

  <div id="message"></div>

  <script>
    let repas = [];

    // Hors de Google Sheets (aperçu du fichier), on utilise des données de démonstration
    const DEMO = typeof google === 'undefined' || !google.script;
    let demo = [
      { code: 'R001', nature: 'REPAS', libelle: 'MOSLI AZ3AR AU POULET', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL - POULET / DJEJ', facultatif: '', astuce: 'FAIRE ROUGIR AU FOUR', remarque: '' },
      { code: 'R002', nature: 'REPAS', libelle: 'TCHICH AU POISSON', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL / POISSON', facultatif: '', astuce: '', remarque: '' },
      { code: 'R003', nature: 'REPAS', libelle: 'TCHALWICHA', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL', facultatif: '', astuce: '', remarque: '' },
      { code: 'R004', nature: 'FAST FOOD', libelle: 'HAMBURGER', principal: 'TOMATE - OIGNON / BSAL - POIVRON / FILFIL / BURGER', facultatif: '', astuce: '', remarque: '' },
      { code: 'R005', nature: 'FAST FOOD', libelle: 'PIZZA', principal: 'TOMATE / THON / OEUF', facultatif: 'FROMAGE', astuce: '', remarque: '' },
      { code: 'R006', nature: 'REPAS', libelle: 'M7AMMAR - MHAMMAR', principal: 'HROUS / STEAK SANS OS / TOMATE CONCENTRE', facultatif: '', astuce: '', remarque: '' }
    ];
    const demoServeur = {
      getRepas: () => demo,
      enregistrerRepas: r => {
        const i = demo.findIndex(x => x.code === r.code);
        const max = demo.reduce((m, x) => Math.max(m, parseInt(x.code.replace(/\D/g, ''), 10) || 0), 0);
        const n = {};
        Object.keys(r).forEach(k => n[k] = String(r[k] || '').trim().toUpperCase());
        n.code = i >= 0 ? demo[i].code : 'R' + String(max + 1).padStart(3, '0');
        if (i >= 0) demo[i] = n; else demo.push(n);
        return demo;
      },
      supprimerRepas: code => (demo = demo.filter(x => x.code !== code))
    };

    // Appelle une fonction de Code.gs (ou sa version démo)
    function serveur(fn, arg, ok, ko) {
      if (DEMO) {
        try { ok(JSON.parse(JSON.stringify(demoServeur[fn](arg)))); } catch (e) { ko(e); }
        return;
      }
      google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](arg);
    }

    function charger() {
      serveur('getRepas', undefined, maj, erreur);
      if (DEMO) toast('Mode démo : les données réelles s’affichent dans Google Sheets');
    }

    function maj(liste) {
      repas = liste || [];
      const natures = [...new Set(repas.map(r => r.nature).filter(Boolean))].sort();
      const sel = document.getElementById('filtreNature');
      const actuel = sel.value;
      sel.innerHTML = '<option value="">Toutes les natures</option>' +
        natures.map(n => `<option ${n === actuel ? 'selected' : ''}>${esc(n)}</option>`).join('');
      document.getElementById('natures').innerHTML = natures.map(n => `<option value="${esc(n)}">`).join('');
      afficher();
    }

    // Supprime accents et met en minuscules pour une recherche tolérante
    function norm(s) {
      return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function decouper(s) {
      return String(s || '').split(/\s*[\/\-,;]\s*/).map(x => x.trim()).filter(Boolean);
    }

    function surligner(texte, termes) {
      let h = esc(texte);
      termes.forEach(t => {
        if (!t) return;
        const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        h = h.replace(re, '<mark>$1</mark>');
      });
      return h;
    }

    // ---------- Ingrédients : synonymes et icônes ----------

    // Nom en dialecte -> nom de référence (ajoutez-en ici si besoin)
    const SYNONYMES = { BSAL: 'OIGNON', FILFIL: 'POIVRON', DJEJ: 'POULET', HOUT: 'POISSON', ADHAM: 'OEUF', JBEN: 'FROMAGE', BATATA: 'POMME DE TERRE' };

    // Le premier motif qui correspond donne l'icône (l'ordre compte)
    const ICONES = [
      [/tomate concentr/, '🥫'], [/tomate/, '🍅'], [/oignon/, '🧅'], [/\bail\b/, '🧄'],
      [/poivron/, '🫑'], [/piment|harissa|hrous/, '🌶️'], [/poulet|dinde/, '🍗'],
      [/poisson|thon|sardine|merou|dorade/, '🐟'], [/crevette|fruits de mer|calamar/, '🦐'],
      [/burger/, '🍔'], [/steak|viande|boeuf|agneau|mouton|kefta|merguez/, '🥩'],
      [/oeuf/, '🥚'], [/fromage|mozzarella|gruyere/, '🧀'], [/pomme de terre|patate|frite/, '🥔'],
      [/carotte/, '🥕'], [/pain|baguette|mlewi|tabouna/, '🥖'], [/riz/, '🍚'],
      [/pate|spaghetti|macaroni|couscous|nouille/, '🍝'], [/citron/, '🍋'], [/olive|huile/, '🫒'],
      [/lait|creme/, '🥛'], [/persil|coriandre|menthe|basilic/, '🌿'], [/salade|laitue|epinard/, '🥬'],
      [/champignon/, '🍄'], [/mais/, '🌽'], [/aubergine/, '🍆'], [/courgette|concombre/, '🥒'],
      [/pois chiche|lentille|haricot|feve/, '🫘'], [/sel\b|epice|cumin|poivre\b/, '🧂']
    ];

    function canon(i) { const u = i.toUpperCase(); return SYNONYMES[u] || u; }

    function icone(nom) {
      const n = norm(nom);
      const trouve = ICONES.find(([re]) => re.test(n));
      return trouve ? trouve[1] : '🥄';
    }

    // Ensemble des ingrédients (noms de référence) d'un repas
    function ingredientsDe(r) {
      return new Set(decouper(r.principal + ' / ' + r.facultatif).map(canon));
    }

    // Libellé d'une puce : nom de référence + synonymes trouvés dans la feuille
    let libellesIngr = {};
    let choisis = new Set();

    function construirePuces() {
      const compte = {};
      libellesIngr = {};
      repas.forEach(r => decouper(r.principal + ' / ' + r.facultatif).forEach(brut => {
        const c = canon(brut);
        (libellesIngr[c] = libellesIngr[c] || new Set([c])).add(brut.toUpperCase());
      }));
      repas.forEach(r => ingredientsDe(r).forEach(c => compte[c] = (compte[c] || 0) + 1));
      // On retire des choix les ingrédients qui n'existent plus
      choisis = new Set([...choisis].filter(c => compte[c]));
      return Object.keys(compte).sort((a, b) => compte[b] - compte[a] || a.localeCompare(b));
    }

    function basculer(c) {
      choisis.has(c) ? choisis.delete(c) : choisis.add(c);
      afficher();
    }

    function toutEffacer() {
      choisis.clear();
      document.getElementById('recherche').value = '';
      document.getElementById('filtreNature').value = '';
      afficher();
    }

    function puceIngr(i, termes) {
      const c = canon(i);
      const style = choisis.has(c) ? ' style="background:#34a853;color:#fff"' : '';
      return `<span${style}>${icone(c)} ${surligner(i, termes)}</span>`;
    }

    // ---------- Filtrage et affichage ----------

    function filtrer() {
      const termes = norm(document.getElementById('recherche').value).split(/\s+/).filter(Boolean);
      const nature = document.getElementById('filtreNature').value;
      const mode = document.getElementById('mode').value;
      return {
        termes,
        liste: repas.filter(r => {
          if (nature && r.nature !== nature) return false;
          const sesIngr = ingredientsDe(r);
          if (![...choisis].every(c => sesIngr.has(c))) return false;
          const nom = norm(r.libelle + ' ' + r.code);
          const ingr = norm(r.principal + ' ' + r.facultatif);
          const cible = mode === 'nom' ? nom : mode === 'ingr' ? ingr : nom + ' ' + ingr + ' ' + norm(r.astuce + ' ' + r.remarque);
          return termes.every(t => cible.includes(t));
        })
      };
    }

    function afficherPuces(resultats) {
      const tous = construirePuces();
      // Ingrédients présents dans au moins un des résultats actuels
      const possibles = new Set();
      resultats.forEach(r => ingredientsDe(r).forEach(c => possibles.add(c)));
      document.getElementById('puces').innerHTML = tous.map(c => {
        const classe = choisis.has(c) ? 'actif' : possibles.has(c) ? '' : 'impossible';
        const libelle = [...libellesIngr[c]].join(' / ');
        return `<button class="puce ${classe}" onclick="basculer('${esc(c)}')" title="${esc(libelle)}">
                  <span class="ico">${icone(c)}</span>${esc(libelle)}</button>`;
      }).join('') || '<span class="aide">Aucun ingrédient pour l’instant.</span>';
    }

    function afficher() {
      construirePuces();
      const { termes, liste } = filtrer();
      afficherPuces(liste);
      const nbChoisis = choisis.size ? ` — ${choisis.size} ingrédient(s) choisi(s)` : '';
      document.getElementById('info').textContent = `${liste.length} repas trouvé(s) sur ${repas.length}${nbChoisis}`;
      document.getElementById('liste').innerHTML = liste.map(r => `
        <div class="carte" onclick="voir('${esc(r.code)}')">
          <span class="badge">${esc(r.nature || '—')}</span><span class="code">${esc(r.code)}</span>
          <h3>${surligner(r.libelle, termes)}</h3>
          <div class="ingr">${decouper(r.principal).map(i => puceIngr(i, termes)).join('')}</div>
          ${r.facultatif ? `<div class="ingr fac" style="margin-top:4px">${decouper(r.facultatif).map(i => puceIngr(i, termes)).join('')}</div>` : ''}
        </div>`).join('') || '<p>Aucun repas ne correspond à la recherche.</p>';
    }

    function voir(code) {
      const r = repas.find(x => x.code === code);
      if (!r) return;
      document.getElementById('detail').innerHTML = `
        <span class="badge">${esc(r.nature || '—')}</span><span class="code">${esc(r.code)}</span>
        <h2>${esc(r.libelle)}</h2>
        <p><b>Ingrédients principaux :</b></p>
        <div class="ingr">${decouper(r.principal).map(i => puceIngr(i, [])).join('') || '—'}</div>
        <p><b>Ingrédients facultatifs :</b></p>
        <div class="ingr fac">${decouper(r.facultatif).map(i => puceIngr(i, [])).join('') || '—'}</div>
        <p><b>💡 Astuce :</b> ${esc(r.astuce) || '—'}</p>
        <p><b>📝 Remarque :</b> ${esc(r.remarque) || '—'}</p>
        <div class="actions">
          <button class="danger" onclick="supprimer('${esc(r.code)}')">Supprimer</button>
          <button onclick="fermer('fondDetail')">Fermer</button>
          <button class="principal" onclick="fermer('fondDetail');ouvrirFormulaire('${esc(r.code)}')">Modifier</button>
        </div>`;
      document.getElementById('fondDetail').classList.add('ouvert');
    }

    function ouvrirFormulaire(code) {
      const r = repas.find(x => x.code === code) || {};
      document.getElementById('titreForm').textContent = code ? 'Modifier ' + code : 'Nouveau repas';
      ['code', 'libelle', 'nature', 'principal', 'facultatif', 'astuce', 'remarque']
        .forEach(c => document.getElementById('f_' + c).value = r[c] || '');
      document.getElementById('fondForm').classList.add('ouvert');
      document.getElementById('f_libelle').focus();
    }

    function enregistrer() {
      const data = {};
      ['code', 'libelle', 'nature', 'principal', 'facultatif', 'astuce', 'remarque']
        .forEach(c => data[c] = document.getElementById('f_' + c).value);
      if (!data.libelle.trim()) { toast('Le nom du repas est obligatoire.'); return; }
      const btn = document.getElementById('btnEnregistrer');
      btn.disabled = true;
      serveur('enregistrerRepas', data,
        l => { btn.disabled = false; fermer('fondForm'); maj(l); toast('Repas enregistré ✔'); },
        e => { btn.disabled = false; erreur(e); });
    }

    function supprimer(code) {
      if (!confirm('Supprimer le repas ' + code + ' ?')) return;
      serveur('supprimerRepas', code,
        l => { fermer('fondDetail'); maj(l); toast('Repas supprimé'); },
        erreur);
    }

    function aleatoire() {
      const { liste } = filtrer();
      if (!liste.length) { toast('Aucun repas disponible.'); return; }
      voir(liste[Math.floor(Math.random() * liste.length)].code);
    }

    function fermer(id) { document.getElementById(id).classList.remove('ouvert'); }

    function toast(t) {
      const m = document.getElementById('message');
      m.textContent = t; m.style.display = 'block';
      clearTimeout(m._t); m._t = setTimeout(() => m.style.display = 'none', 2500);
    }

    function erreur(e) { toast('Erreur : ' + (e && e.message ? e.message : e)); }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') { fermer('fondDetail'); fermer('fondForm'); } });

    charger();
  </script>
</body>
</html>
